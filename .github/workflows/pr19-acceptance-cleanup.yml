name: PR 19 Media Type acceptance cleanup

on:
  push:
    branches:
      - design/typed-inline-content-payloads
    paths:
      - .github/workflows/pr19-acceptance-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
          fetch-depth: 0

      - name: Apply targeted documentation cleanup
        run: python3 .github/pr19_acceptance_cleanup.py

      - name: Bootstrap formatter
        run: npm run bootstrap

      - name: Format touched documentation
        shell: bash
        run: |
          ./node_modules/.bin/prettier --write \
            SCAFFOLDING_PLAN.md \
            docs/README.md \
            docs/INLINE_CONTENT_PAYLOADS.md \
            docs/MVP_VERIFICATION_PLAN.md \
            docs/PORTABLE_DOCUMENT_FORMAT.md \
            docs/decisions/0010-typed-inline-content-payloads.md

      - name: Guard against superseded acceptance wording
        shell: bash
        run: |
          set -euo pipefail
          if rg -n -i \
            'syntactically valid|generic media type syntax|malformed generic media type|caller-supplied valid media type|all other valid media types|every supported media type|other supported media types' \
            SCAFFOLDING_PLAN.md docs/README.md docs/INLINE_CONTENT_PAYLOADS.md docs/MVP_CONTRACT.md docs/MVP_ARCHITECTURE.md docs/MVP_IMPLEMENTATION_SPEC.md docs/MVP_VERIFICATION_PLAN.md docs/PORTABLE_DOCUMENT_FORMAT.md docs/COLLABORATION_MODEL.md docs/PRESERVED_BRANCH_RECONCILIATION.md docs/decisions/0010-typed-inline-content-payloads.md; then
            echo 'Superseded Media Type acceptance wording remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/pr19_acceptance_cleanup.py
          git rm .github/workflows/pr19-acceptance-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCAFFOLDING_PLAN.md docs
          git diff --cached --check
          git commit -m "docs: complete Media Type acceptance cleanup"
          git push origin HEAD:design/typed-inline-content-payloads
