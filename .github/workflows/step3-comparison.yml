name: Step 3 comparative evidence
on:
  pull_request:
    paths:
      - "qualification/step3/**"
      - "scripts/step3-measure.mjs"
      - ".github/workflows/step3-comparison.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - run: npm run test
      - run: npm run step3:measure
      - name: Persist raw comparison results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: step3-qualification-evidence
          path: step3-evidence/
          if-no-files-found: warn
          retention-days: 90
