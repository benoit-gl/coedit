name: Step 3 comparative evidence
on:
  pull_request:
    paths:
      - "qualification/step3/**"
      - "scripts/step3-*.mjs"
      - "scripts/run-step3-qualification.mjs"
      - ".github/workflows/step3-comparison.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LORO_REFERENCE_ROOT: ${{ github.workspace }}/.step3-loro-reference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Install Chromium
        run: npm exec --yes --package=pnpm@11.24.0 -- pnpm exec playwright install --with-deps chromium
      - name: Install isolated pinned Loro reference
        run: npm install --prefix "$LORO_REFERENCE_ROOT" --no-package-lock --no-save loro-crdt@1.16.4
      - name: Run full reproducible comparison
        run: npm run step3:qualification
      - name: Persist raw comparison results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: step3-qualification-evidence
          path: step3-evidence/
          if-no-files-found: warn
          retention-days: 90
