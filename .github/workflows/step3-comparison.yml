name: Step 3 comparative evidence
on:
  pull_request:
    paths:
      - "qualification/step3/**"
      - "scripts/step3-*.mjs"
      - "scripts/run-step3-qualification.mjs"
      - ".github/workflows/step3-comparison.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-replacement-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Run bounded history and lifecycle probes sequentially
        run: |
          mkdir -p step3-history-evidence
          node scripts/step3-mixed-history.mjs > step3-history-evidence/mixed.json 2> step3-history-evidence/mixed.log
          STEP3_LIFECYCLE_CANDIDATE=yjs node scripts/step3-lifecycle-growth.mjs > step3-history-evidence/yjs.json 2> step3-history-evidence/yjs.log
          STEP3_LIFECYCLE_CANDIDATE=automerge node scripts/step3-lifecycle-growth.mjs > step3-history-evidence/automerge.json 2> step3-history-evidence/automerge.log
          STEP3_REVISION="$GITHUB_SHA" STEP3_DIRTY=false node scripts/step3-replacement-fanin.mjs > step3-history-evidence/replacement.json 2> step3-history-evidence/replacement.log
      - name: Persist raw history evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: step3-history-replacement-lifecycle
          path: step3-history-evidence/
          if-no-files-found: error
          retention-days: 90

  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Install Chromium
        run: npm exec --yes --package=pnpm@11.24.0 -- pnpm exec playwright install --with-deps chromium
      - name: Run full reproducible comparison
        run: npm run step3:qualification
      - name: Persist raw comparison results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: step3-qualification-evidence
          path: step3-evidence/
          if-no-files-found: warn
          retention-days: 90

  ordinary-edit:
    name: ordinary-edit-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Install Chromium
        run: npm exec --yes --package=pnpm@11.24.0 -- pnpm exec playwright install --with-deps chromium
      - name: Run scoped ordinary-edit qualification
        run: npm run step3:qualification -- --ordinary-only
      - name: Persist ordinary-edit evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ordinary-edit-qualification-evidence
          path: step3-evidence/
          if-no-files-found: error
          retention-days: 90
