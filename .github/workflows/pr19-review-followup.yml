name: PR 19 review follow-up helper

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.head_commit.message != 'Clarify raw payload materialization boundary'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update design documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/INLINE_CONTENT_PAYLOADS.md",
              """Every payload has a whole-payload/coarse representation boundary. The exact\npublic TypeScript names remain implementation details until the public API is\nspecified.\n""",
              """Every payload has a whole-payload/coarse representation boundary. This is a\npublic engine capability, not only an internal import or codec helper. An\napplication can request the raw/coarse media representation of an InlineContent\nagainst an explicit Version without receiving carrier state. The exact public\nTypeScript names remain implementation details until the public API is specified.\n""",
          )

          replace_once(
              "docs/MVP_ARCHITECTURE.md",
              """- allowlisted native-string text state and protected fine-grained Origin;\n- opaque payload byte state and payload-level Origin;\n- document and History invariants;\n""",
              """- allowlisted native-string text state and protected fine-grained Origin;\n- opaque payload byte state and payload-level Origin;\n- carrier-neutral raw/coarse media materialization for InlineContents at an explicit Version;\n- document and History invariants;\n""",
          )

          replace_once(
              "docs/MVP_ARCHITECTURE.md",
              """  materialize(\n    version: VersionToken,\n  ): Promise<Result<Versioned<MaterializedDocument>, QueryError>>;\n  createRange(request: CreateRangeRequest): Promise<Result<Range, RangeError>>;\n""",
              """  materialize(\n    version: VersionToken,\n  ): Promise<Result<Versioned<MaterializedDocument>, QueryError>>;\n  materializeInlineContentMedia(\n    request: MaterializeInlineContentMediaRequest,\n  ): Promise<Result<Versioned<InlineContentMediaValue>, PayloadMediaError>>;\n  createRange(request: CreateRangeRequest): Promise<Result<Range, RangeError>>;\n""",
          )

          replace_once(
              "docs/MVP_ARCHITECTURE.md",
              """interface ParseRangeRequest {\n  readonly value: SerializedRange;\n  readonly version: VersionToken;\n}\n\ninterface PortableDocument {\n""",
              """interface ParseRangeRequest {\n  readonly value: SerializedRange;\n  readonly version: VersionToken;\n}\n\ninterface MaterializeInlineContentMediaRequest {\n  readonly version: VersionToken;\n  readonly inlineContentId: InlineContentId;\n}\n\ninterface InlineContentMediaValue {\n  readonly inlineContentId: InlineContentId;\n  readonly mediaType: string;\n  readonly bytes: Uint8Array;\n}\n\ninterface PortableDocument {\n""",
          )

          replace_once(
              "docs/MVP_ARCHITECTURE.md",
              """A query can return a detached InlineContent payload value sufficient for an application adapter to inspect the Media Type and render or replace the content without carrier access.\n\nThe fine-grained text editor boundary is specifically for allowlisted text. Conceptually:\n""",
              """A query can return a detached InlineContent payload value sufficient for an application adapter to inspect the Media Type and render or replace the content without carrier access.\n\nThe public engine also provides carrier-neutral raw/coarse media materialization for an InlineContent at an explicit Version. The result contains the preserved Media Type and media-representation bytes, not carrier state or the complete `.coedit` collaboration envelope. Opaque payloads return their exact stored bytes. Allowlisted fine-grained text is encoded from its native string according to the preserved Media Type and the processor capability selected at Gate B. Missing required representation metadata, an unsupported effective encoding, or text that cannot be represented exactly returns an explicit payload-media failure. Materialization is read-only and never rewrites the Media Type or document state. Exact public names remain illustrative until implementation freezes them.\n\nThe fine-grained text editor boundary is specifically for allowlisted text. Conceptually:\n""",
          )

          replace_once(
              "docs/MVP_CONTRACT.md",
              """10. Preserve opaque payload bytes with payload-level Origin; no fine-grained opaque payload editing is required.\n""",
              """10. Preserve opaque payload bytes with payload-level Origin; no fine-grained opaque payload editing is required. Materialize the raw/coarse media representation of any InlineContent at an explicit Version through the public engine boundary: opaque bytes are exact, and allowlisted text encodes under the preserved Media Type or fails explicitly.\n""",
          )

          replace_once(
              "docs/MVP_CONTRACT.md",
              """The suite also creates an opaque InlineContent, replaces its bytes with explicit Origin, and proves byte preservation. Whole-payload replacement of either capability class is atomic.\n""",
              """The suite also creates an opaque InlineContent, replaces its bytes with explicit Origin, and proves byte preservation. It retrieves raw/coarse media through the public engine for both capability classes: opaque retrieval returns the exact stored bytes, and allowlisted text retrieval returns the exact media representation produced under the unchanged declared Media Type. Whole-payload replacement of either capability class is atomic.\n""",
          )

          replace_once(
              "docs/MVP_VERIFICATION_PLAN.md",
              """- Gate B records the exact initial supported UTF-family charset set for `text/markdown` and `text/plain`, and the raw text processor accepts valid representations in that set;\n- a valid declared or effective charset outside the selected initial set fails explicitly as unsupported encoding/capability at a boundary that must decode, encode, or validate the media representation; the implementation does not relabel it, transcode it silently, or reinterpret it as opaque;\n""",
              """- Gate B records the exact initial supported UTF-family charset set for `text/markdown` and `text/plain`, and the raw text processor accepts valid representations in that set;\n- the public engine can materialize raw/coarse media for an explicit Version and InlineContent without carrier access; opaque payloads return their exact stored bytes and allowlisted text returns the exact bytes produced under the preserved Media Type;\n- a valid declared or effective charset outside the selected initial set fails explicitly as unsupported encoding/capability at a boundary that must decode, encode, or validate the media representation; the implementation does not relabel it, transcode it silently, or reinterpret it as opaque;\n""",
          )

          replace_once(
              "docs/MVP_VERIFICATION_PLAN.md",
              """- malformed replacement, invalid fine-grained representation metadata, unsupported charset, decode failure, or a selected resource-guard failure leaves the base unchanged;\n- detached opaque payload bytes and caller-owned replacement buffers cannot mutate engine state after submission;\n""",
              """- malformed replacement, invalid fine-grained representation metadata, unsupported charset, decode failure, or a selected resource-guard failure leaves the base unchanged;\n- raw/coarse materialization fails explicitly for missing required representation metadata, an unsupported effective charset, or current text that cannot be represented exactly; it substitutes no characters, changes no Media Type, and mutates no document state;\n- detached opaque payload bytes and caller-owned replacement buffers cannot mutate engine state after submission;\n""",
          )

          replace_once(
              "docs/decisions/0010-typed-inline-content-payloads.md",
              """```text\ntext/markdown\ntext/plain\n```\n\nCapability dispatch compares the parsed, case-normalized `type/subtype` identity\nto this one compile-time list. Parameters do not participate in the lookup. Raw\nstring-prefix matching is not used.\n""",
              """```text\ntext/markdown\ntext/plain\n```\n\nBoth initial entries are deliberate. The Markdown product path alone would not\nforce the first implementation to separate shared fine-grained text behavior from\nMarkdown-specific behavior. Requiring `text/plain` from Gate B makes that\nfactorization observable from the start: both Media Types share native-string\nediting, Origin, Range, and raw/coarse processor boundaries while retaining\ndifferent representation rules and parameters. This is a qualification\nrequirement, not a rule that all `text/*` types qualify.\n\nCapability dispatch compares the parsed, case-normalized `type/subtype` identity\nto this one compile-time list. Parameters do not participate in the lookup. Raw\nstring-prefix matching is not used.\n""",
          )

          replace_once(
              "docs/decisions/0010-typed-inline-content-payloads.md",
              """### Treat every `text/*` Media Type as fine-grained\n\nDeferred rather than adopted. The MIME top-level taxonomy does not guarantee the\nlocal edit or recovery properties that Coedit wants to qualify. Some textual\nformats also live under `application/*`. The prototype therefore uses an explicit\nallowlist and expands it only with evidence.\n\n### Keep a separate `Text | Opaque` discriminator in addition to Media Type\n""",
              """### Treat every `text/*` Media Type as fine-grained\n\nDeferred rather than adopted. The MIME top-level taxonomy does not guarantee the\nlocal edit or recovery properties that Coedit wants to qualify. Some textual\nformats also live under `application/*`. The prototype therefore uses an explicit\nallowlist and expands it only with evidence.\n\n### Start with only `text/markdown`\n\nRejected for the initial implementation. It would cover the current Markdown\nauthoring path, but it would also let Gate B pass with Markdown-specialized text\nand raw-media code. Requiring `text/plain` from the first implementation forces\nthe shared fine-grained text and raw/coarse processor abstractions to handle more\nthan one Media Type before those boundaries harden. The additional qualification\ncost is deliberate.\n\n### Keep a separate `Text | Opaque` discriminator in addition to Media Type\n""",
          )
          PY

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Format changed documentation
        run: >-
          npm exec -- prettier --write
          docs/INLINE_CONTENT_PAYLOADS.md
          docs/MVP_ARCHITECTURE.md
          docs/MVP_CONTRACT.md
          docs/MVP_VERIFICATION_PLAN.md
          docs/decisions/0010-typed-inline-content-payloads.md

      - name: Commit documentation update
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INLINE_CONTENT_PAYLOADS.md docs/MVP_ARCHITECTURE.md docs/MVP_CONTRACT.md docs/MVP_VERIFICATION_PLAN.md docs/decisions/0010-typed-inline-content-payloads.md
          git commit -m "Clarify raw payload materialization boundary"
          git push origin HEAD:design/typed-inline-content-payloads
