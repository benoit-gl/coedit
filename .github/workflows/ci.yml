name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Check source
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Recheck after build
        run: npm run check

  browser-qualification:
    name: browser-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Install Chromium
        run: npm exec --yes --package=pnpm@11.24.0 -- pnpm exec playwright install --with-deps chromium

      - name: Run browser qualification
        run: npm run test:browser

      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-qualification-traces
          path: browser-traces/
          if-no-files-found: ignore
          retention-days: 14
