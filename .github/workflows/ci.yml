name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Show structural placement formatting diff
        run: |
          npm exec -- prettier --write src/carrier/structuralOperationPlacement.ts
          git diff -- src/carrier/structuralOperationPlacement.ts
          exit 1

      - name: Check source
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Recheck after build
        run: npm run check
