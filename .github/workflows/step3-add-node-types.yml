name: Step 3 add Node types

on:
  push:
    branches:
      - impl/step-3-carrier-qualification

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: impl/step-3-carrier-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Add explicit Node type dependency
        run: npm exec --yes --package=pnpm@11.24.0 -- pnpm add -D @types/node@24.10.1

      - name: Commit package metadata and remove this workflow
        run: |
          rm .github/workflows/step3-add-node-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/step3-add-node-types.yml
          git commit -m "Add Node types for Step 3 qualification"
          git push origin HEAD:impl/step-3-carrier-qualification
