name: PR 19 Media Type acceptance update

on:
  push:
    branches:
      - design/typed-inline-content-payloads
    paths:
      - .github/workflows/pr19-media-type-acceptance-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
          fetch-depth: 0

      - name: Tighten documentation patcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/pr19_media_type_acceptance_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''one(
              verify,
              "- Step 4 records the selected production raw-media processor and supported representation profiles and verifies each selected profile according to its focused contract;",
              "- Step 4 records the selected production Media Type parser/acceptance contract with representative accepted/rejected compatibility fixtures, and records the selected raw-media processor and supported representation profiles;",
          )

          # Portable validation checks the selected acceptance contract and preserves labels.'''
          new = '''one(
              verify,
              "- Step 4 records the selected production raw-media processor and supported representation profiles and verifies each selected profile according to its focused contract;",
              "- Step 4 records the selected production Media Type parser/acceptance contract with representative accepted/rejected compatibility fixtures, and records the selected raw-media processor and supported representation profiles;",
          )
          all_(verify, "generic Media Type syntax", "Media Type acceptance")
          all_(verify, "malformed generic Media Type syntax", "a Media Type value rejected by the selected acceptance contract")

          # Portable validation checks the selected acceptance contract and preserves labels.'''
          if text.count(old) != 1:
              raise SystemExit('expected patcher insertion point exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply documentation patch
        run: python3 .github/pr19_media_type_acceptance_fix.py

      - name: Commit documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/pr19_media_type_acceptance_fix.py
          git rm .github/workflows/pr19-media-type-acceptance-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCAFFOLDING_PLAN.md docs
          git diff --cached --check
          git commit -m "docs: defer Media Type acceptance grammar to Step 4"
          git push origin HEAD:design/typed-inline-content-payloads
