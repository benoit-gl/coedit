name: Temporary Step 2 verification

on:
  push:
    branches:
      - step-2-pure-block-domain

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply TypeDoc documentation fix
        run: node .tmp-fix-step2-typedoc.mjs
      - name: Format changed source
        run: npx prettier --write src/domain/ids.ts src/domain/tags.ts src/domain/structural.ts
      - name: Commit TypeDoc documentation fix
        shell: bash
        run: |
          if git diff --quiet -- src/domain/ids.ts src/domain/tags.ts src/domain/structural.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/domain/ids.ts src/domain/tags.ts src/domain/structural.ts
          git commit -m "docs: document Step 2 exported type fields"
          git push
      - name: Bootstrap dependencies
        run: npm run bootstrap
      - name: Verify repository
        run: npm run check
      - name: Build repository
        run: npm run build
