name: Temporary Step 2 verification

on:
  push:
    branches:
      - step-2-pure-block-domain

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap dependencies
        run: npm run bootstrap
      - name: Verify repository
        run: npm run check
      - name: Build repository
        run: npm run build
