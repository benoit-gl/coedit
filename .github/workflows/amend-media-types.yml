name: Amend PR 19 media types

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Polish Media Type contract wording
        shell: python
        run: |
          from pathlib import Path

          changes = {
              Path('docs/README.md'): [
                  (
                      'Each InlineContent owns one Media-Type-labelled collaborative payload. The initial kinds are `application/vnd.coedit.text` and representative opaque Media Types. Every payload supports atomic type-preserving whole-content replacement with explicit Origin behavior. Under replication, a causally later replacement supersedes replacements it observes; concurrent replacements select one deterministic current winner without wall-clock or packet-arrival arbitration. Losing replacements remain in immutable History and their Versions remain materializable. `application/vnd.coedit.text` additionally supports fine-grained collaborative editing, intrinsic formatting, fine-grained protected Origin, and durable text Ranges. Blob preserves opaque bytes with payload-level Origin and initially has no finer mutation than replacement.',
                      'Each InlineContent owns one collaborative payload labelled with an Internet Media Type. `application/vnd.coedit.text` has the fine-grained collaborative-text capability set. Every other supported Media Type initially uses the generic opaque capability set; its exact bytes and payload-level Origin are preserved. Use `application/octet-stream` when the actual format is unknown. Every payload supports atomic Media-Type-preserving whole-content replacement with explicit Origin behavior. Under replication, a causally later replacement supersedes replacements it observes; concurrent replacements select one deterministic current winner without wall-clock or packet-arrival arbitration. Losing replacements remain in immutable History and their Versions remain materializable.'
                  ),
                  (
                      'The payload suite covers `application/vnd.coedit.text`, opaque payload, universal whole-content replacement, and the deterministic concurrent-replacement tie-break.',
                      'The payload suite covers `application/vnd.coedit.text`, representative generic opaque Media Types, universal whole-content replacement, and the deterministic concurrent-replacement tie-break.'
                  ),
              ],
              Path('docs/PRODUCT_DOMAIN_MODEL.md'): [
                  (
                      '8. Each Media Type supports atomic whole-content replacement with explicit Origin behavior.',
                      '8. Every InlineContent payload supports atomic Media-Type-preserving whole-content replacement with explicit Origin behavior.'
                  ),
                  (
                      '10. A generic opaque Media Type payload owns opaque bytes and one payload-level Origin for its current value.',
                      '10. A payload using the generic opaque capability set owns exact bytes and one payload-level Origin for its current value.'
                  ),
                  ('Media Type:      application/vnd.coedit.text', 'Media Type:        application/vnd.coedit.text'),
              ],
              Path('docs/decisions/0010-typed-inline-content-payloads.md'): [
                  (
                      'Future Media-Type-specific fine-grained editing, in-place Media Type conversion,\nMedia Type parameter rules, and non-text content-local addressing require\nseparate explicit decisions when real application requirements exist.\n',
                      'Future Media-Type-specific fine-grained editing, in-place Media Type conversion,\nMedia Type parameter rules, and non-text content-local addressing require\nseparate explicit decisions when real application requirements exist.\n\n## 7. Standards references\n\n- [RFC 6838: Media Type Specifications and Registration Procedures](https://www.rfc-editor.org/rfc/rfc6838.html) defines the Internet Media Type registration framework and vendor tree.\n- [IANA Media Types](https://www.iana.org/assignments/media-types/media-types.xhtml) is the authoritative registry, including `application/octet-stream`.\n'
                  ),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              old = text
              for source, target in replacements:
                  if source not in text:
                      raise SystemExit(f'Expected text not found in {path}: {source[:80]}')
                  text = text.replace(source, target)
              if text != old:
                  path.write_text(text, encoding='utf-8', newline='\n')
      - name: Format
        run: npm run format
      - name: Report remaining live terminology
        run: |
          echo '--- payload discriminator leftovers ---'
          grep -RInE 'payload[- ]kind|kind-specific|readonly kind: "application/vnd.coedit.text"' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
          echo '--- live Blob wording ---'
          grep -RInE '\bBlob\b|\bblob\b' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' | grep -v 'github.com/.*/blob/' || true
          echo '--- legacy coedit-text token ---'
          grep -RIn 'coedit-text' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
          echo '--- suspicious closed-type wording ---'
          grep -RInE 'initial kinds|initial Media Types are|Media Types are .* and' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Polish Media Type payload contract"
          git push origin HEAD:design/typed-inline-content-payloads
