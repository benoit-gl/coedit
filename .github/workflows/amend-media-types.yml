name: Amend PR 19 media types

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Finish Media Type open-set cleanup
        shell: python
        run: |
          from pathlib import Path

          changes = {
              Path('docs/MARKDOWN_INTERCHANGE.md'): [(
                  '- a selected InlineContent whose Media Type is generic opaque Media Type;',
                  '- a selected InlineContent whose Media Type has no Markdown representation under this contract;'
              )],
              Path('docs/MVP_CONTRACT.md'): [(
                  '7. Support initial InlineContent Media Types `application/vnd.coedit.text` and generic opaque Media Type.',
                  '7. Use Internet Media Types for InlineContent payloads; support `application/vnd.coedit.text` with fine-grained text operations and generic opaque handling for other supported Media Types.'
              )],
              Path('docs/MVP_IMPLEMENTATION_SPEC.md'): [(
                  'Step 4 evolves that opaque boundary into the Media-Type-labelled payload representation defined by `INLINE_CONTENT_PAYLOADS.md`. The initial runtime kinds are `application/vnd.coedit.text` and generic opaque Media Type. The ordinary authored empty-content path creates an empty `application/vnd.coedit.text` value; creation/import paths that deliberately require opaque content use a trusted complete opaque payload value with explicit Origin. This documentation evolution does not require reopening the already completed structural semantics of Step 2.',
                  'Step 4 evolves that opaque boundary into the Media-Type-labelled payload representation defined by `INLINE_CONTENT_PAYLOADS.md`. Runtime payloads carry an Internet Media Type. `application/vnd.coedit.text` selects the fine-grained collaborative-text capability set; other supported Media Types initially use generic opaque handling. The ordinary authored empty-content path creates an empty `application/vnd.coedit.text` value; creation/import paths that deliberately require opaque content supply the actual Media Type when known, complete opaque bytes, and explicit Origin, using `application/octet-stream` only when no more specific type is available. This documentation evolution does not require reopening the already completed structural semantics of Step 2.'
              )],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for source, target in replacements:
                  if source not in text:
                      raise SystemExit(f'Expected text not found in {path}: {source[:100]}')
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8', newline='\n')
      - name: Format
        run: npm run format
      - name: Report remaining live terminology
        run: |
          echo '--- payload discriminator leftovers ---'
          grep -RInE 'payload[- ]kind|kind-specific|readonly kind: "application/vnd.coedit.text"' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
          echo '--- live Blob wording ---'
          grep -RInE '\bBlob\b|\bblob\b' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' | grep -v 'github.com/.*/blob/' || true
          echo '--- legacy coedit-text token ---'
          grep -RIn 'coedit-text' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
          echo '--- suspicious closed-type wording ---'
          grep -RInE 'initial kinds|initial Media Types are|generic opaque Media Type[,.;]|exactly .*generic opaque|initial runtime kinds' README.md SCAFFOLDING_PLAN.md docs --exclude='0010-typed-inline-content-payloads.md' || true
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finish Media Type open-set cleanup"
          git push origin HEAD:design/typed-inline-content-payloads
