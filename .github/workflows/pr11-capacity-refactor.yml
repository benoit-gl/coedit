          rm .github/workflows/pr11-capacity-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align capacity semantics and numeric ownership"
          git push origin HEAD:docs/capacity-targets-not-hard-limits
