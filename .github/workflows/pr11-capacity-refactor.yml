          # Focused attributed-text and browser specs refer to verification-owned numbers.
          replace_regex(
              "docs/ATTRIBUTED_TEXT_AND_ANNOTATIONS.md",
              r'Functional invariants are mandatory\. Performance qualification records the actual\nhardware and software environment used for each run\..*?results, and dependency/license review as qualification evidence\.',
              "Functional invariants are mandatory. `MVP_VERIFICATION_PLAN.md` owns the exact shared qualification workloads, latency target, measurement method, and evidence requirements. This specification requires visible local feedback to stay in the tightest practical loop; routine carrier, persistence, History, replica, open, reload, checkpoint, materialization, or export work must not redefine the editor hot path.",
          )

          replace_exact(
              "docs/BROWSER_PERSISTENCE.md",
              "Malformed, missing, mis-hashed, incompatible, or over-limit records produce a\ntyped recovery error.",
              "Malformed, missing, mis-hashed, incompatible, or over-capacity records produce a\ntyped recovery error.",
          )
          replace_regex(
              "docs/BROWSER_PERSISTENCE.md",
              r'## 11\. Limits and measurements\n.*?\n## 12\. Required verification',
              '''## 11. Measurements

          `MVP_VERIFICATION_PLAN.md` owns the shared representative content and History workload sizes and the shared performance targets. Do not duplicate those numbers here.

          For the browser repository, measure those shared workloads plus:

          - cold open, warm open, ordinary commit, checkpoint, History materialization, and `.coedit` assembly latency;
          - peak encoded and decoded memory;
          - write amplification and database growth; and
          - quota behavior in supported browsers and private modes.

          Record target devices and pass budgets before performance qualification begins. Correctness, atomicity, and no-data-loss requirements are not tradeable for a faster candidate. Browser-specific quota or warning thresholds come from measured platform behavior and are not portable document limits.

          ## 12. Required verification''',
          )

          replace_regex(
              "docs/decisions/0005-semantic-interpretation-boundaries.md",
              r'### Implementation capacity\n\n.*?\n### Carrier semantic activity',
              '''### Implementation capacity

          An arbitrary maximum text or payload size is not a canonical document invariant only because the current carrier or runtime has a practical limit. Implementations can return explicit resource/capacity failures at real boundaries, and hostile-input consumers can enforce safety guards. Qualification workloads remain test evidence rather than validity limits. `CAPACITY_AND_PERFORMANCE_TARGETS.md` owns the cross-cutting policy, and `MVP_VERIFICATION_PLAN.md` owns the exact shared qualification numbers.

          ### Carrier semantic activity''',
          )

          # Index and work-order authority lists.
          replace_exact(
              "docs/README.md",
              "| [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md)                               | Component authority, public engine behavior, and adapter workflows                                                       |",
              "| [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md)                               | Component authority, public engine behavior, and adapter workflows                                                       |\n"
              "| [`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md) | Capacity/resource classification, numeric ownership, verification, and freeze rules                                      |",
