          replace_exact(
              "docs/README.md",
              "- `CAPACITY_AND_PERFORMANCE_TARGETS.md` controls whether a numeric value is a semantic invariant, a minimum implementation envelope, a hostile-input resource guard, or a qualification/performance target.",
