              "[`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md)\ncontrols cross-cutting capacity semantics. This document owns the exact portable\ncodec and hostile-input guard values.",
