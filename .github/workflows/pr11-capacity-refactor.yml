          replace_exact(
              "docs/README.md",
              "\n[`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md) is the cross-cutting authority for the interpretation and revision of provisional numeric capacity and performance targets used by the documents above.\n",
              "\n",
