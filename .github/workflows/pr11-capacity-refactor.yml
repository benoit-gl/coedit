              Path("docs/BROWSER_PERSISTENCE.md"),
              Path("docs/MVP_VERIFICATION_PLAN.md"),
              Path("docs/COLLABORATION_MODEL.md"),
              Path("docs/README.md"),
          ]
          texts = {str(p): p.read_text(encoding="utf-8") for p in authoritative}

          retired = [
              "20 tags per owner",
              "64 Unicode code points per tag",
              "256 UTF-8 bytes per tag",
              "50,000 live Blocks",
              "50,000 live InlineContents",
              "Block depth 1,000",
              "128 Unicode code points and 512 UTF-8 bytes",
              "5,001 advertised Versions",
              "20 canonical local updates",
          ]
          for needle in retired:
              hits = [path for path, text in texts.items() if needle in text]
              if hits:
                  raise RuntimeError(f"retired capacity wording {needle!r} remains in {hits}")

          single_owner = {
              "50 ms": "docs/MVP_VERIFICATION_PLAN.md",
              "100,000 Unicode code points": "docs/MVP_VERIFICATION_PLAN.md",
              "5,000 Contributions": "docs/MVP_VERIFICATION_PLAN.md",
              "10 MiB UTF-8 source": "docs/MARKDOWN_INTERCHANGE.md",
              "200,000 Markdown AST nodes": "docs/MARKDOWN_INTERCHANGE.md",
              "64 MiB UTF-8 JSON": "docs/PORTABLE_DOCUMENT_FORMAT.md",
              "250,000 semantic operations": "docs/PORTABLE_DOCUMENT_FORMAT.md",
              "48 MiB decoded binary chunk data": "docs/PORTABLE_DOCUMENT_FORMAT.md",
          }
          for needle, owner in single_owner.items():
              hits = [path for path, text in texts.items() if needle in text]
              if hits != [owner]:
                  raise RuntimeError(f"numeric ownership for {needle!r}: expected {[owner]}, found {hits}")
          PY

      - name: Bootstrap dependencies
