              "Contributor display names are trimmed and control-character-free. The first implementation must support at least 128 Unicode code points and 512 UTF-8 bytes. Those values are preliminary capacity targets, not a product-level maximum, and can be revised from usage and interoperability evidence.",
              "Contributor display names are trimmed and control-character-free. The MVP defines no application-level length maximum. A real UI, storage, or interoperability constraint can add an explicit boundary guard later under `CAPACITY_AND_PERFORMANCE_TARGETS.md`; that guard is not Contributor semantics.",
          )
          replace_exact(
              "docs/MVP_IMPLEMENTATION_SPEC.md",
              "The early in-memory implementation may use a full snapshot per Contribution within the current qualification envelope. The Step 11 browser target uses immutable effects/update chunks, periodic physical recovery checkpoints, and a small CAS head. Product History remains independent of either representation.",
              "The early in-memory implementation may use a full snapshot per Contribution for bounded prototype and qualification fixtures. The Step 11 browser target uses immutable effects/update chunks, periodic physical recovery checkpoints, and a small CAS head. Product History remains independent of either representation.",
          )

          replace_exact(
              "docs/MVP_ARCHITECTURE.md",
              "This document is authoritative for component ownership and the public document-engine boundary. Product ontology belongs in [`PRODUCT_DOMAIN_MODEL.md`](PRODUCT_DOMAIN_MODEL.md). Implementation order belongs in [`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md). Attributed text, Markdown interchange, `.coedit`, and browser persistence details belong in their focused specifications. Post-MVP replication belongs in [`COLLABORATION_MODEL.md`](COLLABORATION_MODEL.md).",
              "This document is authoritative for component ownership and the public document-engine boundary. Product ontology belongs in [`PRODUCT_DOMAIN_MODEL.md`](PRODUCT_DOMAIN_MODEL.md). Implementation order belongs in [`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md). Capacity classification belongs in [`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md). Attributed text, Markdown interchange, `.coedit`, and browser persistence details belong in their focused specifications. Post-MVP replication belongs in [`COLLABORATION_MODEL.md`](COLLABORATION_MODEL.md).",
          )
          replace_exact(
              "docs/MVP_ARCHITECTURE.md",
              "The same rule applies to capacity. The domain does not impose an arbitrary text or payload-size ceiling only because one carrier, parser, codec, browser, or storage implementation needs a resource guard. Boundary implementations can reject work they cannot process safely and must return explicit resource/capacity failure. Qualification records the tested envelope. Such an implementation limit does not make larger content semantically invalid.\n\n"
              "Resource protection remains mandatory for hostile external inputs. Parser byte limits, nesting limits, archive bounds, opaque-metadata bounds, and similar guards protect the consuming implementation without redefining document ontology.",
              "The same rule applies to capacity. `CAPACITY_AND_PERFORMANCE_TARGETS.md` owns the detailed classification and default rule. The domain has no arbitrary finite size ceiling only because one carrier, parser, codec, browser, or storage implementation has finite resources. An actual implementation constraint returns an explicit capacity/resource failure and does not make larger content semantically invalid. Hostile external inputs still require bounded processing at the consuming boundary.",
          )

          replace_exact(
              "docs/PRODUCT_DOMAIN_MODEL.md",
              "- [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md) defines component authority and the public engine boundary.",
              "- [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md) defines component authority and the public engine boundary.\n"
              "- [`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md) defines cross-cutting capacity and resource semantics.",
          )
          replace_exact(
              "docs/PRODUCT_DOMAIN_MODEL.md",
              "The implementation specification defines initial size, depth, ID, and validation limits.",
              "These invariants do not impose finite document-size, tag-size, or tree-depth maxima. `CAPACITY_AND_PERFORMANCE_TARGETS.md` controls capacity semantics, and `MVP_IMPLEMENTATION_SPEC.md` owns the current Step 2 implementation behavior.",
          )

          replace_exact(
              "docs/MVP_CONTRACT.md",
              "Detailed implementation rules are in [`MVP_IMPLEMENTATION_SPEC.md`](MVP_IMPLEMENTATION_SPEC.md). Domain meaning remains in [`PRODUCT_DOMAIN_MODEL.md`](PRODUCT_DOMAIN_MODEL.md). Public authority boundaries remain in [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md). Attributed text is specified in [`ATTRIBUTED_TEXT_AND_ANNOTATIONS.md`](ATTRIBUTED_TEXT_AND_ANNOTATIONS.md). Markdown interchange is specified in [`MARKDOWN_INTERCHANGE.md`](MARKDOWN_INTERCHANGE.md). Lossless recovery is specified in [`PORTABLE_DOCUMENT_FORMAT.md`](PORTABLE_DOCUMENT_FORMAT.md). Browser persistence is specified in [`BROWSER_PERSISTENCE.md`](BROWSER_PERSISTENCE.md). Implementation order remains in [`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md).",
              "Detailed implementation rules are in [`MVP_IMPLEMENTATION_SPEC.md`](MVP_IMPLEMENTATION_SPEC.md). Domain meaning remains in [`PRODUCT_DOMAIN_MODEL.md`](PRODUCT_DOMAIN_MODEL.md). Public authority boundaries remain in [`MVP_ARCHITECTURE.md`](MVP_ARCHITECTURE.md). Capacity and resource semantics are specified in [`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md). Attributed text is specified in [`ATTRIBUTED_TEXT_AND_ANNOTATIONS.md`](ATTRIBUTED_TEXT_AND_ANNOTATIONS.md). Markdown interchange is specified in [`MARKDOWN_INTERCHANGE.md`](MARKDOWN_INTERCHANGE.md). Lossless recovery is specified in [`PORTABLE_DOCUMENT_FORMAT.md`](PORTABLE_DOCUMENT_FORMAT.md). Browser persistence is specified in [`BROWSER_PERSISTENCE.md`](BROWSER_PERSISTENCE.md). Implementation order remains in [`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md).",
          )
          replace_exact(
              "docs/MVP_CONTRACT.md",
              "Within documented limits, the `.coedit` document contains enough information to reopen the document with equivalent current attributed content, retained History and derivation, stable advertised Version identities, and command-idempotency behavior.",
              "Within the implementation's actual supported resource capacity, the `.coedit` document contains enough information to reopen the document with equivalent current attributed content, retained History and derivation, stable advertised Version identities, and command-idempotency behavior. A codec capacity failure is explicit and is not a claim that the document is semantically invalid.",
          )
          replace_exact(
              "docs/MVP_CONTRACT.md",
              "The document-engine MVP is complete when all in-scope scenarios pass within documented limits and the browser prototype exposes the vertical slice without violating the engine authority boundary.",
              "The document-engine MVP is complete when all in-scope scenarios pass for the required qualification workloads, explicit resource guards fail safely, and the browser prototype exposes the vertical slice without violating the engine authority boundary. Completion does not create arbitrary product-level size maxima.",
          )

          # Markdown owns its exact hostile-input guard values.
          replace_exact(
              "docs/MARKDOWN_INTERCHANGE.md",
              "`PRODUCT_DOMAIN_MODEL.md` controls domain meaning. `MVP_CONTRACT.md` controls the MVP proof boundary. `ATTRIBUTED_TEXT_AND_ANNOTATIONS.md` controls formatting and Origin behavior. `MVP_IMPLEMENTATION_SPEC.md` controls implementation details that are not defined here. `CAPACITY_AND_PERFORMANCE_TARGETS.md` controls the interpretation and revision of provisional numeric capacity targets.",
              "`PRODUCT_DOMAIN_MODEL.md` controls domain meaning. `MVP_CONTRACT.md` controls the MVP proof boundary. `ATTRIBUTED_TEXT_AND_ANNOTATIONS.md` controls formatting and Origin behavior. `MVP_IMPLEMENTATION_SPEC.md` controls implementation details that are not defined here. `CAPACITY_AND_PERFORMANCE_TARGETS.md` controls cross-cutting capacity semantics. This document owns the exact Markdown hostile-input guard values below.",
          )
          replace_regex(
              "docs/MARKDOWN_INTERCHANGE.md",
              r'## 5\. Source handling\n.*?\n## 6\. Heading and section construction',
              '''## 5. Source handling

          Decode source as UTF-8 with fatal error handling. Permit one optional UTF-8 BOM. Normalize CRLF and CR to LF before parsing.

          `sourceName` is display metadata only. Retain a basename, not an absolute local path.

          Treat Markdown input as hostile. The first importer uses these resource guards:

          - 10 MiB UTF-8 source bytes;
          - 200,000 Markdown AST nodes;
          - source nesting depth 100; and
          - source names of 255 Unicode code points and 1 KiB UTF-8.

          These values protect the importer implementation. They are not Markdown or Coedit semantic maxima. This document is the direct owner of the exact guard values. Revise them from parser profiling, target-device measurements, interoperability work, and later usage evidence.

          Do not add a separate generated-Block count guard. The resulting document is limited by semantic validity and the actual resources of the running implementation, not by a Markdown-specific document-size maximum.

          Invalid UTF-8 is a source-format error. Resource exhaustion or an exceeded importer guard is a capacity error. Either failure occurs before the active document is replaced.

          ## 6. Heading and section construction''',
          )

          # Portable format owns codec/hostile-input guard values, not shared qualification numbers.
          replace_exact(
              "docs/PORTABLE_DOCUMENT_FORMAT.md",
