name: Format PR 19

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bootstrap dependencies
        run: npm run bootstrap
      - name: Apply repository formatting
        run: npm run format
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply repository formatting"
          git push origin HEAD:design/typed-inline-content-payloads
