name: PR 19 formatter helper

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Format changed documentation
        run: >-
          npm exec -- prettier --write
          docs/decisions/0001-collaborative-content-provenance-history.md
          docs/decisions/0006-text-position-ownership.md
          docs/INLINE_CONTENT_PAYLOADS.md

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/0001-collaborative-content-provenance-history.md docs/decisions/0006-text-position-ownership.md docs/INLINE_CONTENT_PAYLOADS.md
          git commit -m "Format reconciled payload documentation"
          git push origin HEAD:design/typed-inline-content-payloads
