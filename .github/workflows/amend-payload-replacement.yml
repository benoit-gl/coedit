name: Amend PR 19 whole payload replacement

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Remove last stale wording
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/COLLABORATION_MODEL.md')
          text = path.read_text(encoding='utf-8')
          source = '`application/vnd.coedit.text` additionally supports fine-grained collaborative text,\n  formatting, and Origin operations. Other Media Types initially support only whole-content\n  replacement.'
          target = '`application/vnd.coedit.text` additionally supports fine-grained collaborative text,\n  formatting, and Origin operations. Other Media Types initially support only whole-payload\n  replacement.'
          if source not in text:
              raise SystemExit('Expected collaboration summary text not found')
          path.write_text(text.replace(source, target), encoding='utf-8', newline='\n')
      - name: Format
        run: npm run format
      - name: Scan payload contract
        run: |
          grep -RInE 'Media Type is stable|current Media Type does not change|existing kind|two-kind contract|Media-Type-preserving|type-preserving|whole-content replacement|future .*Media Type conversion|in-place Media Type conversion|format-conversion workflow' README.md SCAFFOLDING_PLAN.md docs || true
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Remove last whole-content wording"
          git push origin HEAD:design/typed-inline-content-payloads
