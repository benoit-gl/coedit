name: Amend PR 19 whole payload replacement

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - name: Finish replacement contract cleanup
        shell: python
        run: |
          from pathlib import Path

          changes = {
              Path('docs/INLINE_CONTENT_PAYLOADS.md'): [
                  (
                      '## 6. Media Type stability and creation\n\nEach live InlineContent has exactly one Media Type. Ordinary whole-content\nreplacement preserves that Media Type.\n\nThe Media Type is part of the payload value. The whole-payload replacement operation can keep or change it atomically with the content. Application-level format conversion is an adapter concern; the document model does not define a second conversion operation.',
                      '## 6. Payload creation and replacement identity\n\nEach live InlineContent owns exactly one current payload value consisting of a Media Type plus Media-Type-specific content. The payload has no independent product identity.\n\nWhole-payload replacement preserves the `InlineContentId` but atomically replaces the complete payload value. The replacement can keep the existing Media Type or provide a different one. Application-level format conversion is an adapter concern; the document model does not define a second conversion operation.'
                  ),
                  (
                      'For every other Media Type under the initial opaque handler, the current payload value has one Origin associated with the whole-payload creation or replacement. Replacing the payload creates the new Origin required by the operation context. A replacement that changes Media Type applies the Origin rules of the new Media Type.\nMoving the InlineContent preserves Media Type, bytes, and Origin.',
                      'For every other Media Type under the initial opaque handler, the current payload value has one Origin associated with the whole-payload creation or replacement. Replacing the payload creates the new Origin required by the operation context. A replacement that changes Media Type applies the Origin rules of the new Media Type.\n\nMoving the InlineContent preserves its complete payload, including Media Type, bytes, and Origin.'
                  ),
              ],
              Path('docs/decisions/0010-typed-inline-content-payloads.md'): [
                  (
                      'Every InlineContent supports one atomic, Media-Type-preserving whole-content\nreplacement operation with explicit Origin behavior.',
                      'Every InlineContent supports one atomic whole-payload replacement operation with explicit Origin behavior. The operation preserves the InlineContent identity and replaces the complete payload value: Media Type plus Media-Type-specific content.'
                  ),
                  (
                      'Payload-specific operations fail explicitly against an incompatible Media Type.\nThey do not sniff bytes, reinterpret arbitrary payloads as Coedit text, or\nsilently change Media Type.\n\nThe current contract does not include in-place Media Type conversion. Such a\nworkflow requires a separate decision.',
                      'Payload-specific fine-grained operations fail explicitly against an incompatible Media Type. They do not sniff bytes or reinterpret arbitrary payloads as Coedit text. Media Type changes only as part of an explicit whole-payload replacement that supplies matching content. The document model therefore needs no separate Media Type conversion operation.'
                  ),
                  (
                      'Fine-grained merge is not required for every Media Type. Whole-content\nreplacement behaves as a convergent replicated register:',
                      'Fine-grained merge is not required for every Media Type. Whole-payload replacement behaves as a convergent replicated register:'
                  ),
                  (
                      'Step 6 remains responsible for the exact whole-payload replacement of `application/vnd.coedit.text` effect on durable\nRange lineage.',
                      'Step 6 remains responsible for the exact effect of whole-payload replacement involving `application/vnd.coedit.text` on durable Range lineage.'
                  ),
              ],
              Path('docs/MVP_ARCHITECTURE.md'): [
                  (
                      'The universal whole-payload replacement operation belongs to the ordinary `DocumentOperation` family. It is valid for every supported Media Type and is type-preserving under the current contract. Payload-specific text operations reject incompatible Media Types explicitly. Exact operation names and request shapes remain implementation details until their implementation step freezes them.',
                      'The universal whole-payload replacement operation belongs to the ordinary `DocumentOperation` family. It preserves the target `InlineContentId` while atomically replacing the complete payload value: Media Type, Media-Type-specific content, and the required Origin effect. The Media Type can stay the same or change, and capability dispatch after success follows the resulting Media Type. Payload-specific fine-grained operations reject incompatible Media Types explicitly. Exact operation names and request shapes remain implementation details until their implementation step freezes them.'
                  ),
                  (
                      'Whole-payload replacement is one such durable command effect. It preserves the target InlineContent Media Type and publishes its replacement value and Origin atomically.',
                      'Whole-payload replacement is one such durable command effect. It preserves the target InlineContent identity and atomically publishes the replacement Media Type, Media-Type-specific content, and required Origin effect.'
                  ),
              ],
              Path('SCAFFOLDING_PLAN.md'): [
                  (
                      '- universal whole-payload replacement is atomic, type-preserving, Origin-aware, and qualified for deterministic eventual convergence;',
                      '- universal whole-payload replacement preserves InlineContent identity, atomically replaces Media Type/content/Origin state, and is qualified for deterministic eventual convergence;'
                  ),
              ],
              Path('docs/MVP_VERIFICATION_PLAN.md'): [
                  (
                      '- a replacement publishes its complete value and required Origin effect atomically;',
                      '- a replacement publishes its complete Media Type, Media-Type-specific content, and required Origin effect atomically;'
                  ),
                  (
                      '- whole-payload replacement is available for both `application/vnd.coedit.text` and representative opaque Media Types;',
                      '- whole-payload replacement is available for every supported Media Type and can keep or change the Media Type;'
                  ),
                  (
                      '- pairwise concurrent whole-payload replacement for `application/vnd.coedit.text` and representative opaque Media Types under the same delivery faults;',
                      '- pairwise concurrent whole-payload replacement under the same delivery faults, including same-Media-Type and different-Media-Type concurrent replacements;'
                  ),
                  (
                      '- whole-content `application/vnd.coedit.text` replacement can be represented without preventing the Step 6 replacement-lineage decision;',
                      '- whole-payload replacement involving `application/vnd.coedit.text`, including replacement to or from another Media Type, can be represented without preventing the Step 6 replacement-lineage decision;'
                  ),
              ],
              Path('docs/RANGE_MODEL.md'): [
                  (
                      'The Step 6 Range gate must define the result when a structural split occurs\nexactly at a Positional Range and when the owning InlineContent is deleted,\nwhole-content replaced, or merged.',
                      'The Step 6 Range gate must define the result when a structural split occurs exactly at a Positional Range and when the owning InlineContent is deleted, merged, or whole-payload replaced. If replacement changes the Media Type away from `application/vnd.coedit.text`, the member is unresolved in that Version. A later replacement back to `application/vnd.coedit.text` must not silently reattach the Range merely because the `InlineContentId` and Media Type match; Step 6 owns the exact lineage/resumption rule.'
                  ),
              ],
              Path('docs/PORTABLE_DOCUMENT_FORMAT.md'): [
                  (
                      '13. payload-specific invariants, including rejection of incompatible operations and absence of implicit Media Type conversion; and',
                      '13. payload-specific invariants, including rejection of incompatible fine-grained operations and no implicit Media Type change outside explicit whole-payload replacement; and'
                  ),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for source, target in replacements:
                  if source not in text:
                      raise SystemExit(f'Expected text not found in {path}: {source[:120]}')
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8', newline='\n')
      - name: Format
        run: npm run format
      - name: Report replacement terminology
        run: |
          echo '--- stale replacement semantics ---'
          grep -RInE 'Media-Type-preserving|type-preserving|ordinary whole-content|whole-content replaced|preserves the target InlineContent Media Type|current contract does not include in-place Media Type conversion|future .*Media Type conversion' README.md SCAFFOLDING_PLAN.md docs || true
          echo '--- whole-content replacement leftovers ---'
          grep -RIn 'whole-content replacement' README.md SCAFFOLDING_PLAN.md docs || true
          echo '--- Range wording ---'
          grep -RInE 'whole-content `application/vnd.coedit.text`|whole-text replacement|whole-value collaborative-text replacement' README.md SCAFFOLDING_PLAN.md docs || true
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Finish whole-payload replacement contract cleanup"
          git push origin HEAD:design/typed-inline-content-payloads
