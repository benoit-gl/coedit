name: PR 19 contract cleanup

on:
  push:
    branches:
      - design/typed-inline-content-payloads
    paths:
      - .github/workflows/pr19-contract-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/typed-inline-content-payloads
          fetch-depth: 0
      - name: Remove stale deferred-contract wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('SCAFFOLDING_PLAN.md'), *Path('docs').rglob('*.md')]
          replacements = {
              'including unfamiliar labels used to qualify dispatch without freezing the production acceptance grammar':
                  'including unfamiliar syntactically valid labels used to qualify dispatch against the fixed Media Type syntax contract',
              'production Media Type parser or syntax-conformance behavior':
                  'production Media Type parser implementation',
              'production Media Type parser, syntax-conformance behavior,':
                  'production Media Type parser implementation,',
              'does not select the production Media Type parser, syntax-conformance behavior, raw-media processor, or supported representation profiles':
                  'does not select the production Media Type parser implementation, raw-media processor, or supported representation profiles',
              'does not select the production Media Type parser, syntax-conformance behavior, or raw-media processor or supported representation profiles':
                  'does not select the production Media Type parser implementation, raw-media processor, or supported representation profiles',
              'The exact Media Type syntax-conformance behavior and detailed raw-media profile matrix are intentionally not part of this ADR.':
                  'The Media Type syntax contract is part of this ADR. The concrete parser implementation and detailed raw-media profile matrix remain Step 4 decisions.',
          }
          changed = False
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed = True

          forbidden = [
              'without freezing the production acceptance grammar',
              'production Media Type parser or syntax-conformance behavior',
              'production Media Type parser, syntax-conformance behavior,',
              'The exact Media Type syntax-conformance behavior and detailed raw-media profile matrix are intentionally not part of this ADR.',
              'accepts it with a transformed result',
              'accepts it with transformation',
              'does not impose exact-preservation or',
              'does not require the production parser to reject every value',
          ]
          for path in files:
              text = path.read_text()
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f'stale contract phrase remains in {path}: {phrase}')
          if not changed:
              raise SystemExit('expected cleanup changes but found none')
          PY
      - run: npm run bootstrap
      - run: npm run format
      - run: npm run check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCAFFOLDING_PLAN.md docs
          git commit -m "Remove stale deferred contract wording"
          git push origin HEAD:design/typed-inline-content-payloads
