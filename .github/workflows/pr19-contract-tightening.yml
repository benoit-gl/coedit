name: PR 19 contract tightening

on:
  push:
    branches:
      - design/typed-inline-content-payloads
    paths:
      - .github/workflows/pr19-contract-tightening.yml

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: design/typed-inline-content-payloads
          fetch-depth: 0

      - name: Tighten contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new):
              text = read(path)
              if old not in text:
                  return 0
              count = text.count(old)
              write(path, text.replace(old, new))
              return count

          # Focused Media Type authority: syntax is standards-defined, parser implementation is not policy.
          path = "docs/INLINE_CONTENT_PAYLOADS.md"
          replace_once(
              path,
              "**Status:** Accepted logical content direction; carrier selection and mixed\nreplacement/edit semantics remain Gate B decisions. Production Media Type\nacceptance and raw-media processing remain Step 4 decisions.",
              "**Status:** Accepted logical content direction; carrier selection and mixed\nreplacement/edit semantics remain Gate B decisions. Media Type syntax is fixed\nby this contract; parser implementation and raw-media processing remain Step 4\ndecisions.",
          )
          replace_once(
              path,
              "This document intentionally does not select the production Media Type parser,\nits exact acceptance behavior, or the complete input/output filter matrix for\nevery accepted Media Type value. Step 4 selects and qualifies the production\nMedia Type acceptance contract and the first raw-media processor capability.",
              "This document fixes the accepted Media Type syntax. Step 4 selects and\nqualifies a parser implementation that conforms to that syntax and the first\nraw-media processor capability. It does not redefine which strings are valid\nMedia Type values.",
          )
          replace_once(
              path,
              "Capability matching is separate from preservation and acceptance. The selected\nMedia Type parser must accept the supplied value and produce a usable\n`type/subtype` identity. The implementation compares the case-normalized\n`type/subtype` identity against one compile-time allowlist. Parameters do not\nparticipate in this capability lookup. Do not use raw string-prefix matching.\n\nThis contract does not define a second Coedit-specific Media Type grammar and\ndoes not require the production parser to reject every value that is outside a\nparticular RFC grammar. Step 4 selects and qualifies the production parser and\nany additional acceptance restrictions. The selected acceptance and parsed\n`type/subtype` classification behavior is a compatibility-visible implementation\ncontract: record representative accepted and rejected values together with the\nparsed identity used for capability dispatch, and do not silently change either\nthe accepted-input domain or capability classification during a parser upgrade.\nReplacing or materially changing the production parser requires explicit\ncompatibility review against existing portable-format versions and the recorded\nfixtures. This contract does not require an automated migration path in advance;\ncompatibility or any conversion/re-import policy is selected when such a change\nis introduced. Step 8 owns the physical portable-format version marker and\ncompatibility policy used to interpret stored state.\n\nThe complete supplied spelling remains durable metadata even when the selected\nparser treats two spellings as the same Media Type identity. Parsing for\nacceptance and capability dispatch therefore does not canonicalize the stored\nvalue.",
              "Capability matching is separate from preservation and representation support.\nA supplied value is a valid Coedit Media Type only when the complete string\nconforms to the following standards-defined syntax:\n\n- the overall value uses the RFC 9110 section 8.3.1 `media-type` form;\n- type and subtype names satisfy the RFC 6838 section 4.2 `restricted-name`\n  grammar;\n- each parameter name satisfies the RFC 6838 section 4.3 `restricted-name`\n  grammar and each parameter value uses the RFC 9110 `token` or `quoted-string`\n  syntax;\n- each semicolon introduces a real parameter; empty parameter slots are rejected;\n- parameter names are ASCII case-insensitive and a parameter name cannot occur\n  more than once; and\n- the entire supplied string must match this syntax. Leading or trailing material\n  outside the media-type value is invalid.\n\nThese rules use the registered-name syntax without requiring an IANA registry\nlookup. A syntactically valid but unfamiliar type is therefore valid document\ncontent and initially uses generic opaque handling.\n\nType and subtype comparison is ASCII case-insensitive. The implementation\ncompares that normalized identity against one compile-time allowlist. Parameters\ndo not participate in capability lookup. Do not use raw string-prefix matching.\n\nThe complete supplied spelling remains durable metadata even when two valid\nspellings identify the same type/subtype. Parsing for validation and capability\ndispatch does not canonicalize the stored value. Parser replacement or upgrade\nmust preserve these syntax rules and classification results; representative\nfixtures verify conformance but do not define a parser-specific accepted-input\ndomain.\n\nReferences: [RFC 9110 section 8.3.1](https://www.rfc-editor.org/rfc/rfc9110.html#section-8.3.1),\n[RFC 9110 section 5.6.6](https://www.rfc-editor.org/rfc/rfc9110.html#section-5.6.6),\n[RFC 6838 section 4.2](https://www.rfc-editor.org/rfc/rfc6838.html#section-4.2),\nand [RFC 6838 section 4.3](https://www.rfc-editor.org/rfc/rfc6838.html#section-4.3).",
          )
          replace_once(
              path,
              "A Media Type value that the selected acceptance contract rejects is invalid\ninput. An accepted unfamiliar Media Type value is valid document content and\nuses generic opaque handling.",
              "A Media Type value that does not satisfy the syntax contract above is invalid\ninput. A syntactically valid unfamiliar Media Type value is valid document content\nand uses generic opaque handling.",
          )
          replace_once(
              path,
              "Detailed Media Type parser/library choice, acceptance behavior, parameter\nsemantics, supported profile combinations, charset support, raw-media\ncodec/library choice, and profile-specific transformations belong to Step 4 and\nits focused verification. This contract does not select them in advance.",
              "The concrete Media Type parser/library choice, representation-affecting\nparameter semantics for the initial raw-media processor, supported profile\ncombinations, charset support, raw-media codec/library choice, and profile-specific\ntransformations belong to Step 4 and its focused verification. The parser must\nimplement the syntax contract above; Step 4 cannot broaden or narrow that syntax\nby dependency choice.",
          )
          replace_once(
              path,
              "| Media Type value rejected by the selected acceptance contract                                | Reject atomically as invalid input.                                                                              |",
              "| Media Type value that violates the fixed syntax contract                                      | Reject atomically as invalid input.                                                                              |",
          )
          replace_once(
              path,
              "The exact lossless native-string domain is intentionally not frozen before the\ncarrier is selected. Step 3 must qualify candidate carrier behavior, including\nordinary Unicode text and edge cases such as ill-formed ECMAScript string\nsequences. Gate B records the supported carrier behavior needed by the production\ncontract. The purpose of that qualification is to expose carrier limitations,\nnot to pre-select a second string representation or validation layer in this\nPR.",
              "A successful fine-grained text operation must preserve the submitted ECMAScript\nstring exactly. Coedit performs no Unicode normalization, replacement, repair, or\nother silent transformation. Step 3 must qualify candidate behavior, including\nordinary Unicode text and ill-formed ECMAScript string sequences such as lone\nsurrogates. For each submitted value, a candidate either preserves the value\nexactly or rejects the operation atomically. A carrier that accepts an operation\nbut materializes a different string does not satisfy this contract for that\ninput.\n\nThe supported collaborative-text domain is therefore the set of ECMAScript\nstrings that the selected carrier can preserve exactly. This rule does not require\na second Unicode representation or a general pre-validation subsystem; an adapter\ncan reject an unsupported value at the carrier boundary so long as no partial\ndocument change is published.",
          )
          replace_once(
              path,
              "Step 4 selects and qualifies the production Media Type parser/acceptance contract\nand the first raw-media processor with its supported representation profiles.\nThe selected capabilities may be deliberately small. Later raw-media profile\nsupport can expand without changing document semantics or stored Media Type\nvalues. Changes to Media Type acceptance or parsed identity require explicit\ncompatibility review and evidence.",
              "Step 4 selects and qualifies a production parser implementation for the fixed\nMedia Type syntax contract and the first raw-media processor with its supported\nrepresentation profiles. The selected raw-media capabilities may be deliberately\nsmall. Later raw-media profile support can expand without changing document\nsemantics or stored Media Type values. Parser upgrades require conformance\nregression evidence for the fixed syntax and type/subtype classification rules.",
          )
          replace_once(
              path,
              "- exact Media Type preservation with parsed type/subtype capability dispatch,\n  using representative test labels without selecting the production acceptance\n  grammar;",
              "- exact Media Type preservation and validation against the fixed syntax contract,\n  with parsed type/subtype capability dispatch;",
          )
          replace_once(
              path,
              "- ordinary Unicode/native-string collaboration works through both candidates and\n  carrier-specific edge behavior is characterized rather than pre-decided here;",
              "- every successful native-string operation preserves the submitted ECMAScript\n  string exactly; edge cases such as lone surrogates are either preserved exactly\n  or rejected atomically, never accepted with a transformed result;",
          )

          # Focused text authority: exact-or-fail is observable API behavior.
          path = "docs/FINE_GRAINED_TEXT_AND_ORIGIN.md"
          replace_once(
              path,
              "Carrier qualification must characterize edge cases where the ECMAScript string\ndomain is broader than the carrier's native text representation, including\nwhether a candidate preserves the submitted value exactly, rejects the operation,\nor accepts it with a transformed result. Gate B decides which observed behavior\nis acceptable for production; this contract does not impose exact-preservation or\nexact-or-fail semantics before carrier selection. Coedit does not add a second\nvalidation subsystem only to make those edge cases portable. If the carrier\nexplicitly rejects an operation, that error propagates through the normal\noperation path and publishes no partial change.",
              "Every successful fine-grained operation must preserve the submitted ECMAScript\nstring exactly. Carrier qualification must characterize edge cases where the\nECMAScript string domain is broader than a candidate's native text representation,\nincluding lone surrogates. For each submitted value, the candidate either\npreserves the value exactly or rejects the operation atomically. Accepting the\noperation and materializing a transformed string is a qualification failure for\nthat input. Coedit does not add Unicode normalization, repair, or a second string\nrepresentation to broaden the carrier domain.",
          )
          replace_once(
              path,
              "Subject to the selected carrier text-domain behavior described above, a\nfine-grained operation changes the source string only as requested. The engine\ndoes not normalize Markdown syntax, repair malformed markup, balance delimiters,\nreflow plain text, or make the current value parseable by an application parser.\nTemporary or permanent application-level syntax errors are valid document text.",
              "A successful fine-grained operation changes the source string exactly as\nrequested. The engine does not normalize Unicode or Markdown syntax, repair\nmalformed markup, balance delimiters, reflow plain text, or make the current value\nparseable by an application parser. If the carrier cannot preserve the requested\nECMAScript string exactly, the operation fails atomically. Temporary or permanent\napplication-level syntax errors are valid document text.",
          )
          replace_once(
              path,
              "- characterization of ill-formed ECMAScript string edge cases, including lone\n  surrogates, recording whether each candidate preserves the submitted value,\n  rejects the operation, or accepts it with a transformed result. These outcomes\n  are carrier-selection evidence; Gate B decides which behavior is acceptable\n  for production rather than requiring exact preservation or exact-or-fail\n  semantics in advance;",
              "- ill-formed ECMAScript string edge cases, including lone surrogates, proving\n  exact preservation on success or atomic rejection when unsupported; transformed\n  successful results are not conforming behavior;",
          )
          replace_once(
              path,
              "- carrier failure for unsupported native-string edge cases propagates without a\n  partial document change;",
              "- unsupported native-string edge cases fail atomically, and no successful text\n  operation can materialize a string different from the submitted value;",
          )

          # Text positions inherit the exact-or-fail text domain.
          path = "docs/TEXT_POSITION_MODEL.md"
          replace_once(
              path,
              "Carrier qualification characterizes ECMAScript string edge cases that the carrier\ncannot represent losslessly. Those cases are not a portable text-position\ninvariant. If the carrier explicitly rejects an operation, that error propagates\nthrough the normal operation path without publishing a partial change.",
              "Carrier qualification characterizes ECMAScript string edge cases that a candidate\ncannot represent losslessly. A successful operation must preserve the submitted\nstring exactly; unsupported values are rejected atomically. Those rejected values\nare outside the selected carrier's supported collaborative-text domain and are not\na portable text-position invariant.",
          )
          replace_once(
              path,
              "- characterization of position behavior for ill-formed ECMAScript string edge\n  cases such as lone surrogates without requiring exact preservation;",
              "- position behavior for ill-formed ECMAScript string edge cases such as lone\n  surrogates when preserved exactly, plus atomic rejection when a candidate cannot\n  preserve the submitted string;",
          )

          # Verification plan: standards syntax and exact-or-fail become mandatory invariants.
          path = "docs/MVP_VERIFICATION_PLAN.md"
          replace_all(path, "production Media Type parser/acceptance contract", "production Media Type parser implementation")
          replace_all(path, "selected production acceptance contract", "fixed Media Type syntax contract")
          replace_all(path, "selected acceptance contract", "fixed Media Type syntax contract")
          replace_all(path, "production accepted-input grammar", "fixed Media Type syntax contract")
          replace_all(path, "accepted-input domain", "syntax-conformance behavior")
          replace_once(
              path,
              "- both candidates characterize isolated high and low surrogate behavior and other ill-formed ECMAScript string edge cases without treating exact preservation of those values as a qualification requirement;",
              "- both candidates characterize isolated high and low surrogate behavior and other ill-formed ECMAScript string edge cases, and every accepted operation preserves the submitted string exactly; unsupported values are rejected atomically;",
          )
          replace_once(
              path,
              "- Gate B records the carrier text-domain behavior required by the production contract instead of introducing an independent pre-carrier Unicode representation or validation subsystem;",
              "- Gate B records the selected carrier's exact-preservation support domain without introducing an independent Unicode representation or normalization subsystem;",
          )
          replace_once(
              path,
              "- Step 3 uses representative Media Type labels to exercise parsed type/subtype dispatch without selecting the production fixed Media Type syntax contract;",
              "- Step 3 exercises the fixed RFC 9110/RFC 6838 Media Type syntax, including accepted case/parameter variants and rejected malformed, duplicate-parameter, empty-parameter-slot, and invalid-name cases;",
          ) if "- Step 3 uses representative Media Type labels to exercise parsed type/subtype dispatch without selecting the production fixed Media Type syntax contract;" in read(path) else None
          # The previous broad replacement can leave the original wording with 'without selecting'.
          text = read(path)
          text = text.replace(
              "- Step 3 uses representative Media Type labels to exercise parsed type/subtype dispatch without selecting the fixed Media Type syntax contract;",
              "- Step 3 exercises the fixed RFC 9110/RFC 6838 Media Type syntax, including accepted case/parameter variants and rejected malformed, duplicate-parameter, empty-parameter-slot, and invalid-name cases;",
          )
          text = text.replace(
              "- Step 4 records the selected production Media Type parser implementation with representative accepted/rejected compatibility fixtures, and records the selected raw-media processor and supported representation profiles;",
              "- Step 4 records the selected production parser implementation and conformance fixtures for the fixed Media Type syntax, and records the selected raw-media processor and supported representation profiles;",
          )
          write(path, text)

          # Work order and implementation summaries must no longer delegate validity policy to Step 4.
          for path in [
              "SCAFFOLDING_PLAN.md",
              "docs/MVP_IMPLEMENTATION_SPEC.md",
              "docs/MVP_CONTRACT.md",
              "docs/PORTABLE_DOCUMENT_FORMAT.md",
              "docs/README.md",
          ]:
              replace_all(path, "production Media Type parser/acceptance contract", "production Media Type parser implementation")
              replace_all(path, "production Media Type acceptance contract", "fixed Media Type syntax contract")
              replace_all(path, "selected production acceptance contract", "fixed Media Type syntax contract")
              replace_all(path, "selected acceptance contract", "fixed Media Type syntax contract")
              replace_all(path, "production accepted-input grammar", "fixed Media Type syntax contract")
              replace_all(path, "accepted-input domain", "syntax-conformance behavior")

          # Specific work-order wording for exact-or-fail carrier qualification.
          path = "SCAFFOLDING_PLAN.md"
          replace_all(path, "the selected carrier's required text-domain behavior", "the selected carrier's exact-preservation text domain")
          replace_all(path, "required carrier text-domain behavior", "the carrier's exact-preservation text domain")
          replace_all(path, "carrier text-domain behavior", "carrier exact-preservation behavior")
          replace_all(path, "without freezing the fixed Media Type syntax contract", "against the fixed Media Type syntax contract")
          text = read(path)
          text = text.replace(
              "plus characterization of carrier behavior for ill-formed string edge cases such as lone surrogates, without promoting those edge cases to portable document invariants;",
              "including ill-formed string edge cases such as lone surrogates, with exact preservation on success or atomic rejection when unsupported;",
          )
          write(path, text)

          # Portable recovery validates syntax but never raw-media representation support.
          path = "docs/PORTABLE_DOCUMENT_FORMAT.md"
          replace_all(path, "checked against\nthe fixed Media Type syntax contract here", "validated against\nthe fixed Media Type syntax contract here")

          # ADR 0010 records the standards rule and exact-or-fail rationale.
          path = "docs/decisions/0010-typed-inline-content-payloads.md"
          replace_once(
              path,
              "**Status:** Accepted direction; carrier and mixed replacement/edit semantics deferred to Gate B; Media Type acceptance and raw-media processor profiles deferred to Step 4",
              "**Status:** Accepted direction; carrier and mixed replacement/edit semantics deferred to Gate B; parser implementation and raw-media processor profiles deferred to Step 4",
          )
          replace_once(
              path,
              "- production Media Type acceptance is selected as a parser contract rather than\n  frozen here from one standards grammar;",
              "- Media Type validity follows fixed Internet-standard syntax while the concrete\n  parser implementation remains an implementation choice;",
          )
          replace_once(
              path,
              "The selected parser must accept the value and produce a usable `type/subtype`\nidentity for capability dispatch. The document model does not rewrite the supplied\nvalue merely because a type is allowlisted. Type/subtype comparison for capability\ndispatch is case-insensitive. Parameters remain part of the preserved value.\n\nMedia Type acceptance, Coedit collaboration capability, and support for a\nspecific raw representation are separate concerns. An accepted unfamiliar Media\nType value can use opaque handling without Coedit certifying its format-specific\nsemantics.\n\nThis ADR does not define a second Coedit-specific Media Type grammar and does not\nrequire the production parser to reject every value outside one selected RFC\ngrammar. Step 4 selects and qualifies the parser and any additional acceptance\nrestrictions. Representative accepted and rejected values become compatibility\nevidence so a parser upgrade cannot silently change the accepted input domain.",
              "A valid value uses the RFC 9110 section 8.3.1 media-type form. Type and\nsubtype names use the RFC 6838 section 4.2 `restricted-name` grammar. Parameter\nnames use the RFC 6838 section 4.3 `restricted-name` grammar; parameter values use\nRFC 9110 token or quoted-string syntax. Every semicolon introduces a parameter,\nduplicate parameter names are invalid under ASCII case-insensitive comparison,\nand the complete supplied string must satisfy the grammar. No IANA registration\nlookup is required for generic opaque storage.\n\nThe document model preserves the supplied spelling exactly. Type/subtype\ncomparison for capability dispatch is ASCII case-insensitive; parameters remain\npart of the preserved value but do not affect allowlist matching. Media Type\nvalidity, Coedit collaboration capability, and support for a specific raw\nrepresentation are separate concerns. Step 4 selects a parser implementation and\nconformance fixtures, but cannot broaden or narrow the accepted syntax by library\nchoice.",
          )
          replace_once(
              path,
              "The exact lossless native-string domain is not frozen before carrier selection.\nStep 3 qualifies candidate behavior, including ordinary Unicode text and\nill-formed ECMAScript string edge cases. Gate B records the supported carrier\nbehavior required by production. This ADR does not choose a second string\nrepresentation or validation layer in advance.",
              "Every successful fine-grained text operation preserves the submitted ECMAScript\nstring exactly. Step 3 qualifies candidate behavior, including ordinary Unicode\ntext and ill-formed ECMAScript string edge cases. A candidate can reject a value\nit cannot preserve, but accepting an operation and materializing a transformed\nstring is non-conforming. Gate B therefore records the selected carrier's exact\npreservation domain rather than choosing a normalization or repair policy. This\nADR does not require a second string representation or general Unicode validation\nlayer.",
          )
          replace_all(path, "production Media Type parser/acceptance contract", "production Media Type parser implementation")
          replace_all(path, "production Media Type parser or accepted-input domain", "production Media Type parser implementation")
          replace_all(path, "accepted-input domain", "syntax-conformance behavior")
          replace_all(path, "required carrier\n  text-domain behavior", "carrier exact-preservation\n  behavior")
          replace_all(path, "carrier text-domain edge behavior must be characterized at Gate B rather than\n  assumed in this ADR;", "carrier support for exact-or-fail ECMAScript string operations must be\n  characterized at Gate B;")
          replace_all(path, "Step 4 must select and qualify a production Media Type parser/acceptance\n  contract and preserve its compatibility-visible accepted-input behavior;", "Step 4 must select and qualify a production Media Type parser implementation\n  against the fixed syntax contract;")
          replace_once(
              path,
              "### Freeze RFC 6838/RFC 9110 syntax as the Coedit acceptance contract now\n\nRejected for this gate. Standards grammar is useful reference material, but the\ndocument model does not need to invent or freeze a stricter parser contract\nbefore the production parsing implementation is selected. A well-established\nparser can deliberately accept a broader practical input domain. Step 4 must\nselect and qualify that behavior and record compatibility fixtures instead of\nsilently inheriting whatever a dependency happens to accept.",
              "### Let the selected parser define a broader practical input domain\n\nRejected. Parser-library permissiveness is not a durable document contract. Coedit\nuses the RFC 9110/RFC 6838 syntax rules above so two conforming implementations\nmake the same validity and capability decision for the same Media Type string.\nStep 4 can select any parser implementation that conforms to those rules.",
          )
          replace_all(path, "do not freeze the production\n  accepted-input grammar here", "verify the fixed Media Type\n  syntax contract")
          replace_all(path, "The exact Media Type accepted-input domain and detailed raw-media profile matrix are intentionally not part of this ADR.", "The Media Type syntax contract is part of this ADR. The concrete parser implementation and detailed raw-media profile matrix remain Step 4 decisions.")

          # Correct the lingering Gate E heading.
          replace_all("SCAFFOLDING_PLAN.md", "### Gate E — Interactive rich editing", "### Gate E — Interactive text editing")

          # Mechanical audit for the two rejected design states.
          forbidden = [
              "accepts it with a transformed result",
              "accepts it with transformation",
              "without treating exact preservation of those values as a qualification requirement",
              "does not impose exact-preservation or",
              "does not require the production parser to reject every value",
              "Freeze RFC 6838/RFC 9110 syntax as the Coedit acceptance contract now",
          ]
          for md in list(Path("docs").rglob("*.md")) + [Path("SCAFFOLDING_PLAN.md")]:
              text = md.read_text()
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f"stale contract phrase remains in {md}: {phrase}")
          PY

      - name: Bootstrap
        run: npm run bootstrap

      - name: Format
        run: npm run format

      - name: Verify
        run: npm run check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCAFFOLDING_PLAN.md docs
          git commit -m "Tighten text and Media Type contracts"
          git push origin HEAD:design/typed-inline-content-payloads
