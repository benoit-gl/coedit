name: PR 19 documentation propagation

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Propagate fine-grained media-type contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          old = 'application/vnd.coedit.text'
