name: Step 3 temporary validation

on:
  push:
    branches:
      - impl/step-3-collaborative-content-stacked

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Bootstrap
        run: npm run bootstrap
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
