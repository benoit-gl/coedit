name: Step3 format capture
on:
  pull_request:
    paths:
      - qualification/step3/integrated/**
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - run: npx prettier --write qualification/step3/integrated
      - name: Emit formatted sources
        run: |
          for file in qualification/step3/integrated/*.ts; do
            echo "FORMATTED:${file}:$(base64 -w0 "${file}")"
          done
