name: Step 3 format current changes

on:
  push:
    branches:
      - impl/step-3-carrier-qualification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: impl/step-3-carrier-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Format allocator changes
        run: >-
          npm exec -- prettier --write
          src/carrier/fractionalIndexPosition.ts
          src/carrier/fuguePosition.ts
          src/carrier/position.ts
          src/carrier/positionCandidates.test.ts

      - name: Commit formatting and remove this workflow
        run: |
          rm .github/workflows/step3-format-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/carrier/fractionalIndexPosition.ts src/carrier/fuguePosition.ts src/carrier/position.ts src/carrier/positionCandidates.test.ts .github/workflows/step3-format-current.yml
          git commit -m "Format Step 3 allocator qualification"
          git push origin HEAD:impl/step-3-carrier-qualification
