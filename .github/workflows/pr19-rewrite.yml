name: PR19 rewrite
on:
  push:
    branches: [design/typed-inline-content-payloads]
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/pr19_rewrite.py
      - run: |
          git rm .github/pr19_rewrite.py .github/workflows/pr19-rewrite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SCAFFOLDING_PLAN.md docs
          git commit -m "Propagate allowlisted text payload contract"
          git push origin HEAD:${GITHUB_REF_NAME}
