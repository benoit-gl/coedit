name: PR 11 review cleanup

on:
  push:
    branches:
      - docs/capacity-targets-not-hard-limits

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/capacity-targets-not-hard-limits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Apply review cleanup
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text.rstrip() + "\n", encoding="utf-8")

          def replace_exact(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_regex(path: str, pattern: str, new: str) -> None:
              text = read(path)
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one regex match, found {count}: {pattern[:100]!r}")
              write(path, updated)

          # Remove the obsolete Step 2 tag-capacity scaffolding. The semantic
          # normalization rules remain unchanged.
          replace_exact(
              "src/domain/tags.ts",
              "// TODO(capacity-cleanup): These retained guard branches are effectively disabled.\n"
              "// Remove them in a later cruft pass if no measured resource constraint needs them.\n"
              "const MAX_TAGS = Number.MAX_SAFE_INTEGER;\n"
              "const MAX_CODE_POINTS = Number.MAX_SAFE_INTEGER;\n"
              "const MAX_UTF8_BYTES = Number.MAX_SAFE_INTEGER;\n\n",
              "",
          )
          replace_exact(
              "src/domain/tags.ts",
              " * Identity is case-insensitive. The first normalized spelling wins. Empty\n"
              " * values are removed. Control characters are rejected. Retained capacity\n"
              " * guard branches are effectively unbounded and do not define tag semantics.",
              " * Identity is case-insensitive. The first normalized spelling wins. Empty\n"
              " * values are removed. Control characters are rejected.",
          )
          replace_exact(
              "src/domain/tags.ts",
              "    if ([...candidate].length > MAX_CODE_POINTS) {\n"
              "      return invalid(\n"
              "        `A tag cannot exceed ${MAX_CODE_POINTS} Unicode code points.`,\n"
              "      );\n"
              "    }\n"
              "    if (utf8ByteLength(candidate) > MAX_UTF8_BYTES) {\n"
              "      return invalid(`A tag cannot exceed ${MAX_UTF8_BYTES} UTF-8 bytes.`);\n"
              "    }\n\n",
              "",
          )
          replace_exact(
              "src/domain/tags.ts",
              "      normalized.push(candidate);\n"
              "      if (normalized.length > MAX_TAGS) {\n"
              "        return invalid(`An owner cannot have more than ${MAX_TAGS} tags.`);\n"
              "      }",
              "      normalized.push(candidate);",
          )
          replace_regex(
              "src/domain/tags.ts",
              r'\nfunction utf8ByteLength\(value: string\): number \{.*?\n\}\n$',
              "\n",
          )

          # Remove the obsolete Step 2 structural-capacity branches and their
          # unreachable error kind. Tree walking remains iterative.
          replace_exact(
              "src/domain/structural.ts",
              "// TODO(capacity-cleanup): These retained guard branches are effectively disabled.\n"
              "// Remove them in a later cruft pass if no measured resource constraint needs them.\n"
              "const MAX_BLOCKS = Number.MAX_SAFE_INTEGER;\n"
              "const MAX_INLINE_CONTENTS = Number.MAX_SAFE_INTEGER;\n"
              "const MAX_BLOCK_DEPTH = Number.MAX_SAFE_INTEGER;\n\n",
              "",
          )
          replace_exact(
              "src/domain/structural.ts",
              "/** Stable classification for an expected structural or capacity-guard rejection. */",
              "/** Stable classification for an expected structural-domain rejection. */",
          )
          replace_exact(
              "src/domain/structural.ts",
              '  | "Cycle"\n  | "LimitExceeded"\n  | "NoEffect";',
              '  | "Cycle"\n  | "NoEffect";',
          )
          replace_exact(
              "src/domain/structural.ts",
              "/** Expected structural operation or retained capacity-guard failure. */",
              "/** Expected structural-domain failure. */",
          )
          replace_exact(
              "src/domain/structural.ts",
              "/** Validates Step 2 live structural invariants and retained capacity guards. */",
              "/** Validates all Step 2 live structural invariants. */",
          )
          replace_exact(
              "src/domain/structural.ts",
              "  const durableIds = new Set<string>([document.id]);\n"
              "  let blockCount = 0;\n"
              "  let inlineCount = 0;\n"
              "  const stack: Array<{ readonly block: Block; readonly depth: number }> = [\n"
              "    { block: document.root, depth: 1 },\n"
              "  ];",
              "  const durableIds = new Set<string>([document.id]);\n"
              "  const stack: Block[] = [document.root];",
          )
          replace_exact(
              "src/domain/structural.ts",
              "    const entry = stack.pop();\n"
              "    if (entry === undefined) {\n"
              "      break;\n"
              "    }\n"
              "    const { block, depth } = entry;\n"
              "    blockCount += 1;\n"
              "    if (blockCount > MAX_BLOCKS) {\n"
              "      return failure(\n"
              "        \"LimitExceeded\",\n"
              "        \"The current implementation capacity for live Blocks was exceeded.\",\n"
              "      );\n"
              "    }\n"
              "    if (depth > MAX_BLOCK_DEPTH) {\n"
              "      return failure(\n"
              "        \"LimitExceeded\",\n"
              "        \"The current implementation capacity for Block depth was exceeded.\",\n"
              "      );\n"
              "    }",
              "    const block = stack.pop();\n"
              "    if (block === undefined) {\n"
              "      break;\n"
              "    }",
          )
          replace_exact(
              "src/domain/structural.ts",
              "    for (const content of block.contents) {\n"
              "      inlineCount += 1;\n"
              "      if (inlineCount > MAX_INLINE_CONTENTS) {\n"
              "        return failure(\n"
              "          \"LimitExceeded\",\n"
              "          \"The current implementation capacity for live InlineContents was exceeded.\",\n"
              "        );\n"
              "      }",
              "    for (const content of block.contents) {",
          )
          replace_exact(
              "src/domain/structural.ts",
              "        stack.push({ block: child, depth: depth + 1 });",
              "        stack.push(child);",
          )

          replace_exact(
              "docs/MVP_IMPLEMENTATION_SPEC.md",
              "The Step 2 source keeps its earlier guard branches for now, but sets their thresholds to `Number.MAX_SAFE_INTEGER` so they are effectively disabled before ordinary runtime or allocation constraints. The source marks those branches as candidates for a later cruft-cleanup pass. Remove them if later evidence shows that no explicit guard is useful. If profiling exposes a real resource constraint, add an explicit implementation guard and report a capacity/resource failure; do not redefine the input as semantically invalid.",
              "Step 2 retains no finite capacity-guard branches for those dimensions. If profiling exposes a real resource constraint, add an explicit guard at the affected implementation boundary and report a capacity/resource failure; do not redefine otherwise valid input as semantically invalid.",
          )

          # Keep the exact qualification values in their direct owner only. State
          # explicitly that they are qualification numbers, not hard limits.
          replace_exact(
              "docs/MVP_VERIFICATION_PLAN.md",
              "This plan owns the shared representative carrier/storage qualification workloads: 100,000 Unicode code points in representative InlineContent and 5,000 Contributions in representative History. These are demanding test workloads, not semantic maxima or implementation acceptance ceilings. Run smaller growth points and larger characterization points when practical so scaling behavior is visible.",
              "This plan owns the shared representative carrier/storage qualification workloads: 100,000 Unicode code points in representative InlineContent and 5,000 Contributions in representative History. These values are qualification numbers, not hard limits, semantic maxima, implementation acceptance ceilings, or product guarantees. Run smaller growth points and larger characterization points when practical so scaling behavior is visible.",
          )
          replace_exact(
              "docs/decisions/0001-collaborative-content-provenance-history.md",
              "- [`../MVP_ARCHITECTURE.md`](../MVP_ARCHITECTURE.md) for component authority;",
              "- [`../MVP_ARCHITECTURE.md`](../MVP_ARCHITECTURE.md) for component authority;\n"
              "- [`../CAPACITY_AND_PERFORMANCE_TARGETS.md`](../CAPACITY_AND_PERFORMANCE_TARGETS.md) for capacity classification and numeric ownership;",
          )
          replace_exact(
              "docs/decisions/0001-collaborative-content-provenance-history.md",
              "Before the CollaborativeContent implementation and `.coedit` carrier encoding are\n"
              "frozen, run the same headless and editor-integrated suite against Yjs v13 and\n"
              "Automerge. Track Yjs v14 for a later rerun after stable release.\n\n"
              "The suite must cover:",
              "Before the CollaborativeContent implementation and `.coedit` carrier encoding are\n"
              "frozen, run the same headless and editor-integrated suite against Yjs v13 and\n"
              "Automerge. Track Yjs v14 for a later rerun after stable release.\n\n"
              "The exact representative workload values are qualification numbers owned by\n"
              "`MVP_VERIFICATION_PLAN.md`. They are not hard limits, semantic maxima, or product\n"
              "guarantees.\n\n"
              "The suite must cover:",
          )
          replace_exact(
              "docs/decisions/0001-collaborative-content-provenance-history.md",
              "- representative 100,000-character content and 5,000-Contribution load,\n"
              "  growth, save/open, and materialization behavior; and",
              "- the shared representative content and History qualification workloads,\n"
              "  including growth, save/open, and materialization behavior; and",
          )

          # Finish the collaboration-model terminology sweep so capacity rejection
          # is not confused with semantic invalidity.
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "[`STRUCTURAL_CARRIER_MODEL.md`](STRUCTURAL_CARRIER_MODEL.md), which defines the\n"
              "accepted Block carrier and structural merge semantics,\n"
              "and [`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md), which defines the current\n"
              "implementation order.",
              "[`STRUCTURAL_CARRIER_MODEL.md`](STRUCTURAL_CARRIER_MODEL.md), which defines the\n"
              "accepted Block carrier and structural merge semantics,\n"
              "[`CAPACITY_AND_PERFORMANCE_TARGETS.md`](CAPACITY_AND_PERFORMANCE_TARGETS.md),\n"
              "which defines capacity classification and resource-guard semantics, and\n"
              "[`../SCAFFOLDING_PLAN.md`](../SCAFFOLDING_PLAN.md), which defines the current\n"
              "implementation order.",
          )
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "prove the exact causal envelope, dependency handling, authorization, limits,\n"
              "restart-safe transport, and atomic integration behavior.",
              "prove the exact causal envelope, dependency handling, authorization,\n"
              "resource-capacity handling, restart-safe transport, and atomic integration\n"
              "behavior.",
          )
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "schema validation, invariants, limits, contribution verification, and atomic\n"
              "publication rules.",
              "schema validation, invariants, resource-capacity checks, contribution\n"
              "verification, and atomic publication rules.",
          )
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "requested. Invalid, unauthorized, or over-limit records are rejected without\n"
              "partially changing visible state.",
              "requested. Invalid or unauthorized records and records that exceed an\n"
              "implementation resource guard are rejected without partially changing visible\n"
              "state. Resource-capacity rejection does not make an otherwise valid document\n"
              "semantically invalid.",
          )
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "schema/capability versions, and resource limits. Offline work created before an",
              "schema/capability versions, and resource-capacity guards. Offline work created before an",
          )
          replace_exact(
              "docs/COLLABORATION_MODEL.md",
              "- authenticated authorization and resource limits;",
              "- authenticated authorization and resource-capacity guards;",
          )

          # Assertions for the incomplete-refactor cases found in review.
          checks = {
              "src/domain/tags.ts": ["MAX_TAGS", "MAX_CODE_POINTS", "MAX_UTF8_BYTES", "utf8ByteLength"],
              "src/domain/structural.ts": ["MAX_BLOCKS", "MAX_INLINE_CONTENTS", "MAX_BLOCK_DEPTH", '"LimitExceeded"'],
              "docs/decisions/0001-collaborative-content-provenance-history.md": ["100,000-character", "5,000-Contribution"],
          }
          for path, needles in checks.items():
              text = read(path)
              for needle in needles:
                  if needle in text:
                      raise RuntimeError(f"{path}: obsolete review target remains: {needle!r}")

          verification = read("docs/MVP_VERIFICATION_PLAN.md")
          required = [
              "100,000 Unicode code points",
              "5,000 Contributions",
              "qualification numbers, not hard limits",
          ]
          for needle in required:
              if needle not in verification:
                  raise RuntimeError(f"verification plan lost required qualification wording: {needle!r}")
          PY

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Format changed files
        run: npm run format

      - name: Verify source
        run: npm run check

      - name: Build production output
        run: npm run build

      - name: Verify again after build
        run: npm run check

      - name: Commit verified result and remove temporary workflow
        run: |
          rm .github/workflows/pr11-review-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete PR 11 capacity refactor cleanup"
          git push origin HEAD:docs/capacity-targets-not-hard-limits
