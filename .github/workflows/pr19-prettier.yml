name: PR 19 formatter

on:
  push:
    branches:
      - automation/pr19-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run bootstrap
      - run: npx prettier --write docs/decisions/0001-collaborative-content-provenance-history.md docs/INLINE_CONTENT_PAYLOADS.md docs/MVP_IMPLEMENTATION_SPEC.md docs/MVP_VERIFICATION_PLAN.md docs/PORTABLE_DOCUMENT_FORMAT.md docs/README.md SCAFFOLDING_PLAN.md src/domain/model.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/0001-collaborative-content-provenance-history.md docs/INLINE_CONTENT_PAYLOADS.md docs/MVP_IMPLEMENTATION_SPEC.md docs/MVP_VERIFICATION_PLAN.md docs/PORTABLE_DOCUMENT_FORMAT.md docs/README.md SCAFFOLDING_PLAN.md src/domain/model.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format narrowed payload design"
          git push origin HEAD:design/typed-inline-content-payloads
