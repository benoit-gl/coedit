name: Temporary Merge 7 formatter
on:
  push:
    branches:
      - step3-merge7-application-editor-qualification
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run bootstrap
      - name: Print exact formatted file blobs
        run: |
          node_modules/.bin/prettier --write qualification/step3/editor/semanticText.ts qualification/step3/editor/clipboard.ts qualification/step3/editor/editor.test.ts
          node -e "const f=require('fs'); for (const p of ['semanticText.ts','clipboard.ts','editor.test.ts']) {const name='qualification/step3/editor/'+p; console.log('BEGIN_BLOB_'+p); console.log(f.readFileSync(name).toString('base64')); console.log('END_BLOB_'+p)}"
