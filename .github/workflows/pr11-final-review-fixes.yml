name: PR 11 final review fixes

on:
  push:
    branches:
      - docs/capacity-targets-not-hard-limits

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/capacity-targets-not-hard-limits
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Apply requested review fixes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "SCAFFOLDING_PLAN.md",
              "into an opaque bounded version-1 `.coedit` artifact",
              "into an opaque version-1 `.coedit` artifact",
          )

          replace(
              "docs/MVP_ARCHITECTURE.md",
              "An actual implementation constraint returns an explicit capacity/resource failure and does not make larger content semantically invalid. Hostile external inputs still require bounded processing at the consuming boundary.",
              "An actual implementation constraint returns an explicit capacity/resource failure and does not make larger content semantically invalid. Any public engine error can report that a local bound or capacity limit caused the operation to fail when applicable. The error must identify that cause as a capacity/resource failure so that clients do not mistake it for a statement that the document or requested state is semantically invalid. This rule does not require the MVP to define a complete error taxonomy in advance. Hostile external inputs still require bounded processing at the consuming boundary.",
          )
          PY

      - name: Verify
        run: |
          npm run bootstrap
          npm run check
          npm run build

      - name: Commit verified changes and remove temporary workflow
        run: |
          rm .github/workflows/pr11-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCAFFOLDING_PLAN.md docs/MVP_ARCHITECTURE.md .github/workflows/pr11-final-review-fixes.yml
          git commit -m "Clarify capacity failure reporting"
          git push origin HEAD:docs/capacity-targets-not-hard-limits
