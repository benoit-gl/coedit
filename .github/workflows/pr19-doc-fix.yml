name: PR 19 documentation fix

on:
  push:
    branches:
      - design/typed-inline-content-payloads
    paths:
      - .github/workflows/pr19-doc-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads

      - name: Apply focused cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "docs/README.md",
              "Every other supported Media Type initially uses the generic opaque capability set; its exact bytes and payload-level Origin are preserved. Use `application/octet-stream` when the actual format is unknown.",
              "Every other supported Media Type initially uses the generic opaque capability set; its exact bytes and payload-level Origin are preserved. An application can deliberately use `application/octet-stream` when it has opaque bytes but no more specific format information.",
          )

          replace(
              "docs/MVP_CONTRACT.md",
              "Each InlineContent owns one collaborative payload labelled with an Internet Media Type. allowlisted fine-grained text selects the fine-grained collaborative-text capability set; every other supported Media Type initially selects the generic opaque capability set.",
              "Each InlineContent owns one collaborative payload labelled with an Internet Media Type. Allowlisted fine-grained text selects the fine-grained collaborative-text capability set; every other supported Media Type initially selects the generic opaque capability set.",
          )

          replace(
              "docs/MVP_CONTRACT.md",
              "- allowlisted fine-grained text selects the fine-grained collaborative-text capability set and other supported Media Types initially select the generic opaque capability set;",
              "- Allowlisted fine-grained text selects the fine-grained collaborative-text capability set and other supported Media Types initially select the generic opaque capability set;",
          )

          replace(
              "docs/MVP_ARCHITECTURE.md",
              "`PORTABLE_DOCUMENT_FORMAT.md` owns the exact `.coedit` wire contract. The UX treats `bytes` as opaque. No specific MIME type is part of the accepted MVP design yet.",
              "`PORTABLE_DOCUMENT_FORMAT.md` owns the exact `.coedit` wire contract. The UX treats `bytes` as opaque. No specific Media Type for the `.coedit` artifact itself is part of the accepted MVP design yet.",
          )

          replace(
              "docs/MVP_VERIFICATION_PLAN.md",
              "- malformed generic Media Type syntax, a valid unfamiliar Media Type, and an allowlisted Media Type whose raw representation is unsupported by the selected processor are distinct cases;\n- case variants and parameters give consistent type/subtype capability matching without a registry lookup while the complete supplied Media Type survives unchanged;",
              "- malformed generic Media Type syntax, a valid unfamiliar Media Type, and an allowlisted Media Type whose raw representation is unsupported by the selected processor are distinct cases;\n- generic Media Type syntax covers RFC 6838 restricted names, RFC 9110 token and quoted-string parameter values, case-insensitive duplicate-parameter rejection, complete `name=value` parameters, and preservation of accepted source spelling;\n- case variants and parameters give consistent type/subtype capability matching without a registry lookup while the complete supplied Media Type survives unchanged;",
          )

          replace(
              "docs/MVP_VERIFICATION_PLAN.md",
              "Verify keyboard-only structural creation and movement, predictable focus after operations, single-text-editor ownership for allowlisted fine-grained text, payload-aware rendering, historical read-only behavior, visible failure/retry state, and no direct React mutation of durable document state.\n\nUse a real browser for IME, focus transfer, clipboard behavior, and other interactions that cannot be qualified reliably in a simulated DOM.",
              "Verify keyboard-only structural creation and movement, predictable focus after operations, single-text-editor ownership for allowlisted fine-grained text, payload-aware rendering, historical read-only behavior, visible failure/retry state, and no direct React mutation of durable document state.\n\nWhen a renderer, navigation path, or another application adapter activates inert Markdown, embedded HTML, links, or other payload-derived content, verify the selected application sanitization and activation policy against representative hostile source. Source-preservation tests do not substitute for activation-boundary security tests, and this plan does not preselect a sanitizer or URL-policy library.\n\nUse a real browser for IME, focus transfer, clipboard behavior, activation-boundary security behavior, and other interactions that cannot be qualified reliably in a simulated DOM.",
          )
          PY

      - name: Commit focused cleanup
        shell: bash
        run: |
          git rm .github/workflows/pr19-doc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md docs/MVP_CONTRACT.md docs/MVP_ARCHITECTURE.md docs/MVP_VERIFICATION_PLAN.md
          git commit -m "docs: finish PR 19 design cleanup"
          git push origin HEAD:design/typed-inline-content-payloads
