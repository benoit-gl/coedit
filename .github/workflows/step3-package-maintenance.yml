name: Step 3 package maintenance

on:
  push:
    branches:
      - impl/step-3-carrier-qualification

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: impl/step-3-carrier-qualification

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Remove stale recovered dependencies
        run: >-
          npm exec --yes --package=pnpm@11.24.0 -- pnpm remove
          @automerge/prosemirror @types/mdast remark-gfm remark-parse unified y-prosemirror

      - name: Add Step 3 qualification dependencies
        run: >-
          npm exec --yes --package=pnpm@11.24.0 -- pnpm add
          dompurify@3.4.14 fractional-indexing@4.0.0 fugue@3.0.0

      - name: Add browser qualification dependency
        run: >-
          npm exec --yes --package=pnpm@11.24.0 -- pnpm add -D @playwright/test@1.62.1

      - name: Commit exact package metadata and remove this workflow
        run: |
          rm .github/workflows/step3-package-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/step3-package-maintenance.yml
          git commit -m "Refresh Step 3 qualification dependencies"
          git push origin HEAD:impl/step-3-carrier-qualification
