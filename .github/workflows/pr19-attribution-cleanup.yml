name: PR 19 attribution cleanup

on:
  push:
    branches:
      - design/typed-inline-content-payloads

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: design/typed-inline-content-payloads
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bootstrap dependencies
        run: npm run bootstrap

      - name: Apply attribution cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          OLD = "ATTRIBUTED_TEXT_AND_ANNOTATIONS.md"
          NEW = "FINE_GRAINED_TEXT_AND_ORIGIN.md"

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old!r}")
              write(path, value.replace(old, new, 1))

          focused = "docs/ATTRIBUTED_TEXT_AND_ANNOTATIONS.md"

          replace_once(
              focused,
              "# Fine-grained collaborative text and attribution specification",
              "# Fine-grained text and Origin specification",
          )
          replace_once(
              focused,
              "It defines native-string editing, fine-grained Origin attribution, copy/paste and\n"
              "restore lineage, transient selection, and carrier qualification. It does **not**\n"
              "define formatting, rendering, Markdown parsing, list semantics, link semantics,\n"
              "or another application presentation model.\n",
              "It defines native-string editing, fine-grained Origin attribution and projection,\n"
              "copy/paste and restore lineage, transient selection, and carrier qualification. It\n"
              "does **not** define formatting, rendering, Markdown parsing, list semantics, link\n"
              "semantics, or another application presentation model.\n\n"
              "Coedit keeps two attribution questions separate. **Origin** answers who or what\n"
              "created payload material. **Contribution attribution** answers who performed a\n"
              "durable operation in this document. Payload material therefore has Origin\n"
              "provenance and participates in attributed Contribution History. Structural state —\n"
              "including Block and InlineContent existence, placement, ownership, ordering, tags,\n"
              "and child presentation — has Contribution History but no Origin. The trusted\n"
              "genesis root is the deliberate pre-Contribution exception.\n\n"
              "This document owns the fine-grained-text Origin side of that split. The\n"
              "product-wide Contribution and History contracts remain owned by\n"
              "`PRODUCT_DOMAIN_MODEL.md`, `MVP_CONTRACT.md`, and `MVP_ARCHITECTURE.md`.\n",
          )
          replace_once(
              focused,
              "## 5. Origin and activity behavior",
              "## 5. Origin and Contribution behavior",
          )
          replace_once(
              focused,
              "Origin answers who or what created payload material. Contribution actor answers\n"
              "who performed an operation in this document.\n",
              "Origin and Contribution attribution are independent. Origin follows the authorship\n"
              "or source of payload material. A Contribution records the acting Contributor and\n"
              "the exact durable semantic activity performed in this document. Coedit does not\n"
              "replace History with a mutable payload or structural `lastModifiedBy` field.\n",
          )
          replace_once(
              focused,
              "An Origin record and the Contribution that first uses it publish atomically.\n"
              "`OriginId` is stable, immutable, and document-scoped. An OriginRecord describes\n"
              "one authorship/source event, not a mutable Contributor profile.\n\n"
              "The initial behavior is:\n",
              "An Origin record and the Contribution that first uses it publish atomically.\n"
              "`OriginId` is stable, immutable, and document-scoped. An OriginRecord describes\n"
              "one authorship/source event, not a mutable Contributor profile.\n\n"
              "A public fine-grained-text projection must expose detached, carrier-neutral Origin\n"
              "state sufficient for a caller to associate every live logical authored text unit\n"
              "in the returned string with exactly one `OriginId` and inspect the corresponding\n"
              "immutable OriginRecord without private carrier access. The projection can coalesce\n"
              "adjacent equal Origins into runs for display, but that coalescing cannot change the\n"
              "underlying attribution. The Origin mapping and text must describe the same Version.\n"
              "The exact public run shape and coordinate representation remain implementation\n"
              "details until the implementation step freezes them.\n\n"
              "This Origin projection does not define a per-text Contribution-run or\n"
              "`last modifier` projection. The current public Contribution surface remains\n"
              "History listing and semantic changeset summaries; a finer modification-attribution\n"
              "projection requires its own accepted contract.\n\n"
              "The initial behavior is:\n",
          )

          product = "docs/PRODUCT_DOMAIN_MODEL.md"
          replace_once(
              product,
              "Origin and Range lineage share atomic versioning with text where required. Comments, navigation, application links, and later durable reference holders can store or serialize the shared Range value for allowlisted fine-grained text without making Range a universal payload or provenance entity.\n",
              "Origin and Range lineage share atomic versioning with text where required. Comments, navigation, application links, and later durable reference holders can store or serialize the shared Range value for allowlisted fine-grained text without making Range a universal payload or provenance entity.\n\n"
              "Coedit has two independent attribution axes. Origin describes who or what created payload material; Contribution attribution describes who performed each durable semantic mutation. Payload material participates in both models. Structural state — Block and InlineContent existence, placement, ownership, ordering, tags, and child presentation — is attributable through Contributions but has no Origin. Trusted genesis construction is the deliberate exception: it creates the initial root before the first Contribution.\n",
          )
          replace_once(
              product,
              "Origin identifies the human, imported source, automation, AI/software agent, or unknown source that created logical payload material. It is distinct from the Contributor who later copies, moves, pastes, replaces, or restores that material.\n",
              "Origin identifies the human, imported source, automation, AI/software agent, or unknown source that created logical payload material. It is distinct from the Contributor who later copies, moves, pastes, replaces, or restores that material. Origin is a payload-material concept, not a property of Block or InlineContent structure.\n",
          )

          architecture = "docs/MVP_ARCHITECTURE.md"
          replace_once(
              architecture,
              "The value contains the exact supplied Media Type, the current native string, and detached protected Origin information required for correct attributed editing. It contains no engine-owned formatting, parsed Markdown, rendered tree, or document-level `HardBreak` value.\n",
              "The value contains the exact supplied Media Type, the current native string, and detached protected Origin information required for correct attributed editing. It contains no engine-owned formatting, parsed Markdown, rendered tree, or document-level `HardBreak` value.\n\n"
              "`DetachedTextOriginState` is a carrier-neutral public projection, not an opaque carrier token. For every live logical authored text unit in the returned string, the client must be able to determine its `OriginId` and inspect the corresponding immutable OriginRecord without private carrier access. The implementation can coalesce adjacent equal Origins into runs, provided the mapping remains exact and version-correlated with the returned text. Exact TypeScript shapes and text-coordinate representation remain illustrative until implementation freezes them.\n\n"
              "This MVP boundary does not define a per-text Contribution-run or `last modifier` projection. Contribution activity remains available through History listing and semantic changeset summaries. A finer modification-attribution projection requires a separate contract.\n",
          )

          contract = "docs/MVP_CONTRACT.md"
          replace_once(
              contract,
              "Origin identifies who or what created material. The Contribution identifies who performed the operation in this document. Copy and restore preserve Origin according to the payload contract while recording the copy/restore actor and source/derivation separately.\n",
              "Origin identifies who or what created material. The Contribution identifies who performed the operation in this document. Copy and restore preserve Origin according to the payload contract while recording the copy/restore actor and source/derivation separately. Payload material therefore has Origin provenance and Contribution History, while structural state has Contribution History but no Origin. Trusted genesis-root construction is the deliberate pre-Contribution exception.\n\n"
              "A public allowlisted fine-grained-text projection must expose carrier-neutral Origin information sufficient to associate every live logical authored text unit with exactly one `OriginId` and inspect the corresponding OriginRecord without private carrier access. Adjacent equal Origins can be coalesced into derived display runs. The MVP does not require an analogous per-text Contribution-run or `last modifier` projection.\n",
          )
          replace_once(
              contract,
              "- generic opaque payload handling preserves exact bytes and payload-level Origin;\n"
              "- Block and InlineContent tags have independent ownership;\n",
              "- generic opaque payload handling preserves exact bytes and payload-level Origin;\n"
              "- payload material has Origin provenance while durable payload and structural mutations are attributed through Contributions;\n"
              "- Block and InlineContent structural state has no Origin; trusted genesis-root construction is the deliberate pre-Contribution exception;\n"
              "- Block and InlineContent tags have independent ownership;\n",
          )
          replace_once(
              contract,
              "A user can reorganize an imported document and edit allowlisted fine-grained text. Every durable structural, text or whole-payload replacement uses an attributed command.\n",
              "A user can reorganize an imported document and edit allowlisted fine-grained text. Every durable structural, text or whole-payload replacement uses an attributed command. The browser can query one fine-grained text projection and derive an Origin-based author display without private carrier access.\n",
          )

          verification = "docs/MVP_VERIFICATION_PLAN.md"
          replace_once(
              verification,
              "- derived display runs can coalesce equal Origin without becoming durable range\n"
              "  entities; and\n"
              "- detached values cannot mutate engine state.\n",
              "- a public fine-grained-text projection returns text and detached carrier-neutral\n"
              "  Origin state for the same Version;\n"
              "- every live logical authored text unit in that projection maps to exactly one\n"
              "  `OriginId`, and every referenced immutable OriginRecord can be inspected without\n"
              "  private carrier access;\n"
              "- derived display runs can coalesce adjacent equal Origin without changing the\n"
              "  exact underlying attribution or becoming durable range entities; and\n"
              "- detached values cannot mutate engine state.\n",
          )
          replace_once(
              verification,
              "- later successful durable commands each create exactly one logical Contribution and resulting Version;\n",
              "- later successful durable commands each create exactly one logical Contribution and resulting Version;\n"
              "- structural creation, movement, ownership/order, tag, and child-presentation changes are attributable through their Contributions and do not create structural Origin records;\n",
          )

          for path, old, new in [
              (
                  "SCAFFOLDING_PLAN.md",
                  "defines fine-grained text and attribution behavior, clipboard lineage, Range-holder behavior, and carrier qualification.",
                  "defines fine-grained text and Origin behavior, clipboard lineage, Range-holder behavior, and carrier qualification.",
              ),
              (
                  "docs/README.md",
                  "Detailed allowlisted fine-grained text editing and attribution behavior and text Range-holder lifecycle outside the shared Range contract.",
                  "Detailed allowlisted fine-grained text editing and Origin behavior and text Range-holder lifecycle outside the shared Range contract.",
              ),
              (
                  "docs/TEXT_POSITION_MODEL.md",
                  "owns attributed-text behavior.",
                  "owns fine-grained text and Origin behavior.",
              ),
          ]:
              value = read(path)
              if old in value:
                  write(path, value.replace(old, new))

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              try:
                  value = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if OLD in value:
                  path.write_text(value.replace(OLD, NEW), encoding="utf-8")

          old_path = Path("docs") / OLD
          new_path = Path("docs") / NEW
          if not old_path.exists() or new_path.exists():
              raise RuntimeError("unexpected authority rename state")
          old_path.rename(new_path)
          PY

      - name: Format changed Markdown
        shell: bash
        run: |
          npx prettier --write docs/FINE_GRAINED_TEXT_AND_ORIGIN.md
          git diff --name-only --diff-filter=ACMRT -z -- '*.md' | xargs -0 -r npx prettier --write --

      - name: Check rename and scope guards
        shell: bash
        run: |
          test -f docs/FINE_GRAINED_TEXT_AND_ORIGIN.md
          test ! -e docs/ATTRIBUTED_TEXT_AND_ANNOTATIONS.md
          if rg -n 'ATTRIBUTED_TEXT_AND_ANNOTATIONS\.md' . --glob '!node_modules/**' --glob '!dist/**'; then
            echo 'stale attributed-text authority filename remains' >&2
            exit 1
          fi
          git diff --check

      - name: Check source
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Recheck after build
        run: npm run check

      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          rm .github/workflows/pr19-attribution-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify Origin attribution contract'
          git push origin HEAD:design/typed-inline-content-payloads
