[package]
name = "coedit-local"
version = "0.1.0"
description = "A portable, local-first hierarchical editor"
authors = ["Coedit contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "coedit_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
ammonia = "=4.1.2"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
hex = "=0.4.3"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.11.0", features = [] }
tauri-plugin-dialog = "=2.7.1"
thiserror = "=2.0.18"
uuid = { version = "=1.21.0", features = ["v4", "serde"] }
